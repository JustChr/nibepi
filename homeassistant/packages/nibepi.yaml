# ─────────────────────────────────────────────────────────────────────────────
#  NibePi — Home Assistant helper package
#
#  Everything the NIBE pump itself cannot publish: derived thermal power, live
#  COP, energy meters that the Energy dashboard accepts, alarm text, and the
#  alarm reset call.
#
#  Install: copy to <config>/packages/nibepi.yaml and make sure configuration.yaml
#  contains
#      homeassistant:
#        packages: !include_dir_named packages
#
#  Model: F1155 (ground source). Entity ids follow NibePi's MQTT discovery with
#  device name "Nibe Heat Pump", i.e. <domain>.nibe_heat_pump_nibe_<register title>.
#
#  Requires these registers to be enabled in the NibePi UI (Registers tab):
#      40072  BF1 EP14 Flow            — without it there is no heat output or COP
#      43084  Int. el.add. Power       — immersion heater share of the input power
#      43427  Compressor State EP14
#      43086  Prio
#  See homeassistant/README.md for the full recommended register list.
# ─────────────────────────────────────────────────────────────────────────────

template:
  - sensor:
      # ── Thermal output ────────────────────────────────────────────────────
      # P = flow[l/min] × ΔT[K] × 4.186[kJ/kg·K] / 60 = flow × ΔT × 0.06977 kW
      # The heat medium side is water, so no glycol correction is needed here.
      #
      # Supply is read from BT12 (condenser out) when register 40017 is enabled,
      # and falls back to BT2 otherwise. BT2 works: measured on an F1155 during a
      # hot water charge (Prio 20), BT2 56.0 °C against BT3 51.3 °C at 9.8 l/min,
      # so it tracks the charge circuit rather than stagnating. BT12 is preferred
      # only because it is the condenser outlet proper — upstream of QN10 and of
      # any external mixing — so it stays the same measurement whichever way the
      # diverter points. Enabling 40017 is a refinement, not a prerequisite.
      - name: Nibe Heat Output
        unique_id: nibe_heat_output
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:radiator
        availability: >-
          {{ has_value('sensor.nibe_heat_pump_nibe_bf1_ep14_flow')
             and has_value('sensor.nibe_heat_pump_nibe_eb100_ep14_bt3_return_temp')
             and (has_value('sensor.nibe_heat_pump_nibe_eb100_ep14_bt12_condensor_out')
                  or has_value('sensor.nibe_heat_pump_nibe_bt2_supply_temp_s1')) }}
        state: >-
          {% set flow = states('sensor.nibe_heat_pump_nibe_bf1_ep14_flow') | float(0) %}
          {% set sup  = states('sensor.nibe_heat_pump_nibe_eb100_ep14_bt12_condensor_out')
                        | float(states('sensor.nibe_heat_pump_nibe_bt2_supply_temp_s1') | float(0)) %}
          {% set ret  = states('sensor.nibe_heat_pump_nibe_eb100_ep14_bt3_return_temp') | float(0) %}
          {% if flow > 0.5 and sup > ret %}
            {{ (flow * (sup - ret) * 0.06977) | round(2) }}
          {% else %}
            0
          {% endif %}

      # ── Electrical input ──────────────────────────────────────────────────
      # Inverter power to the compressor plus whatever the immersion heater draws.
      # NOTE: register 43141 is the compressor's input power only — the brine and
      # heat medium pumps and the control board are not included, so the COP below
      # is a compressor COP and reads roughly 3–6 % optimistic versus a meter on
      # the supply line.
      - name: Nibe Electrical Input
        unique_id: nibe_electrical_input
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:flash
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_compr_in_power') }}"
        state: >-
          {% set cpr = states('sensor.nibe_heat_pump_nibe_compr_in_power') | float(0) / 1000 %}
          {% set add = states('sensor.nibe_heat_pump_nibe_int_el_add_power') | float(0) %}
          {{ (cpr + add) | round(3) }}

      # ── Live COP ──────────────────────────────────────────────────────────
      # Deliberately unavailable while the compressor is off or barely loaded:
      # a ratio of two near-zero numbers is noise, not a performance figure.
      - name: Nibe COP
        unique_id: nibe_cop
        state_class: measurement
        icon: mdi:gauge
        availability: >-
          {{ has_value('sensor.nibe_heat_output') and has_value('sensor.nibe_electrical_input')
             and states('sensor.nibe_electrical_input') | float(0) > 0.15
             and states('sensor.nibe_heat_output') | float(0) > 0.3 }}
        state: >-
          {{ (states('sensor.nibe_heat_output') | float
              / states('sensor.nibe_electrical_input') | float) | round(2) }}

      # ── Compressor state as text ──────────────────────────────────────────
      # Register 43427's info string uses "20 = Stopped" (spaces around the =),
      # which NibePi's state-map parser does not match, so the entity stays
      # numeric and needs mapping here.
      - name: Nibe Compressor State
        unique_id: nibe_compressor_state_text
        icon: mdi:engine
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_compressor_state_ep14') }}"
        state: >-
          {% set m = {20: 'Stopped', 40: 'Starting', 60: 'Running', 100: 'Stopping'} %}
          {{ m.get(states('sensor.nibe_heat_pump_nibe_compressor_state_ep14') | int(-1), 'Unknown') }}

      # ── Alarm text ────────────────────────────────────────────────────────
      # The alarm table is generated from lib/alarms.json — do not hand-edit the
      # line between the markers. Regenerate with: node homeassistant/gen-alarms.js
      - name: Nibe Alarm Text
        unique_id: nibe_alarm_text
        icon: mdi:alert-circle-outline
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_alarm') }}"
        state: >-
          {% set code = states('sensor.nibe_heat_pump_nibe_alarm') | int(-1) %}
          {# GENERATED-ALARM-MAP-BEGIN #}
          {% set names = {1: 'Sensor fault BT1', 2: 'Sensor fault BT2', 3: 'Sensor fault BT3', 6: 'Sensor fault BT6', 7: 'Sensor fault BT7', 10: 'Sensor fault BT10', 11: 'Sensor fault BT11', 12: 'Sensor fault BT12', 16: 'Sensor fault BT16', 20: 'Sensor fault BT20 (AZ1)', 21: 'Sensor fault BT21 (AZ1)', 22: 'Sensor fault DEW-BT6', 25: 'Sensor fault BT25', 26: 'Sensor fault AZ1-BT26', 27: 'Sensor fault BP8', 28: 'Sensor fault BT71', 29: 'Sensor fault BT29', 31: 'Sensor fault BT63', 32: 'Sensor fault BS1', 33: 'Sensor fault EP30-BT53', 34: 'Sensor fault EP30-BT53 (solar)', 35: 'Sensor fault EM1-BT52', 37: 'Sensor fault EP21-BT2', 38: 'Sensor fault EP22-BT2', 39: 'Sensor fault EP23-BT2', 40: 'Sensor fault EQ1-BT64', 41: 'Compressor phase 1 missing', 42: 'Compressor phase 2 missing', 43: 'Faulty phase sequence', 44: 'Overheated softstart', 45: 'Phase fault', 50: 'High pressure alarm', 54: 'Motor protection alarm', 55: 'Hot gas alarm', 56: 'Incorrect serial number', 57: 'Incorrect firmware', 58: 'Pressure switch', 60: 'Low HTF out', 63: 'Low air flow', 64: 'Low exhaust air temperature', 65: 'High condensation water level', 66: 'High condensation water level (container)', 67: 'Antifreeze protection supply air', 69: 'Non-calibrated air flow sensor', 70: 'Perm. com. error input card', 71: 'Perm. com. error base card', 72: 'Perm. com. error softstart card', 73: 'Perm. com. error heating system 2', 74: 'Perm. com. error heating system 3', 75: 'Perm. com. error base card (AA26)', 76: 'Perm. com. error heating system 4', 77: 'Perm. com. error additive with shunt', 78: 'Perm. com. error pool', 79: 'Perm. com. error FLM', 83: 'Unsuccessful defrosting', 86: 'Perm. com. error SAM 40', 87: 'Perm. com. error step controlled additive', 88: 'Perm. com. error Solar', 89: 'Perm. com. error HPAC', 90: 'Perm. com. fault groundwater pump', 91: 'Perm. com. error HWC', 92: 'Perm. com. error DEW', 93: 'Perm. com. error 2-pipes cooling', 94: 'Perm. com. error PCD4', 95: 'Perm. com. error FJVM', 9