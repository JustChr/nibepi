      # ── Energy meters the Energy dashboard will accept ────────────────────
      # NibePi's discovery does not set state_class, so the pump's own kWh
      # registers cannot feed utility_meter or the Energy dashboard directly.
      # These mirrors add the missing total_increasing class.
      - name: Nibe Energy Heating Produced
        unique_id: nibe_energy_heating_produced
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_heat_meter_heat_cpr_and_add_ep14') }}"
        state: "{{ states('sensor.nibe_heat_pump_nibe_heat_meter_heat_cpr_and_add_ep14') | float }}"

      - name: Nibe Energy Hot Water Produced
        unique_id: nibe_energy_hot_water_produced
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_heat_meter_hw_cpr_and_add_ep14') }}"
        state: "{{ states('sensor.nibe_heat_pump_nibe_heat_meter_hw_cpr_and_add_ep14') | float }}"

      # ── Seasonal performance from the utility meters ──────────────────────
      - name: Nibe COP Today
        unique_id: nibe_cop_today
        state_class: measurement
        icon: mdi:chart-line
        availability: >-
          {{ has_value('sensor.nibe_electric_energy_daily')
             and states('sensor.nibe_electric_energy_daily') | float(0) > 0.2 }}
        state: >-
          {% set heat = states('sensor.nibe_heating_energy_daily') | float(0) %}
          {% set hw   = states('sensor.nibe_hot_water_energy_daily') | float(0) %}
          {% set el   = states('sensor.nibe_electric_energy_daily') | float(0) %}
          {{ ((heat + hw) / el) | round(2) }}

      - name: Nibe COP Month
        unique_id: nibe_cop_month
        state_class: measurement
        icon: mdi:chart-line
        availability: >-
          {{ has_value('sensor.nibe_electric_energy_monthly')
             and states('sensor.nibe_electric_energy_monthly') | float(0) > 1 }}
        state: >-
          {% set heat = states('sensor.nibe_heating_energy_monthly') | float(0) %}
          {% set hw   = states('sensor.nibe_hot_water_energy_monthly') | float(0) %}
          {% set el   = states('sensor.nibe_electric_energy_monthly') | float(0) %}
          {{ ((heat + hw) / el) | round(2) }}

  - binary_sensor:
      - name: Nibe Alarm Active
        unique_id: nibe_alarm_active
        device_class: problem
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_alarm') }}"
        state: "{{ states('sensor.nibe_heat_pump_nibe_alarm') | int(0) != 0 }}"

      - name: Nibe Compressor Running
        unique_id: nibe_compressor_running
        device_class: running
        icon: mdi:engine
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_compressor_frequency_actual') }}"
        state: "{{ states('sensor.nibe_heat_pump_nibe_compressor_frequency_actual') | float(0) > 0 }}"

      - name: Nibe Immersion Heater Active
        unique_id: nibe_immersion_heater_active
        device_class: running
        icon: mdi:heating-coil
        availability: "{{ has_value('sensor.nibe_heat_pump_nibe_int_el_add_power') }}"
        state: "{{ states('sensor.nibe_heat_pump_nibe_int_el_add_power') | float(0) > 0.05 }}"

# ── Electrical energy by Riemann sum of the input power ──────────────────────
sensor:
  - platform: integration
    source: sensor.nibe_electrical_input
    name: Nibe Electric Energy
    unique_id: nibe_electric_energy
    unit_prefix: k
    unit_time: h
    method: left
    round: 3

# ── Daily / monthly buckets ─────────────────────────────────────────────────
utility_meter:
  nibe_heating_energy_daily:
    name: Nibe Heating Energy Daily
    source: sensor.nibe_energy_heating_produced
    cycle: daily
  nibe_heating_energy_monthly:
    name: Nibe Heating Energy Monthly
    source: sensor.nibe_energy_heating_produced
    cycle: monthly
  nibe_hot_water_energy_daily:
    name: Nibe Hot Water Energy Daily
    source: sensor.nibe_energy_hot_water_produced
    cycle: daily
  nibe_hot_water_energy_monthly:
    name: Nibe Hot Water Energy Monthly
    source: sensor.nibe_energy_hot_water_produced
    cycle: monthly
  nibe_electric_energy_daily:
    name: Nibe Electric Energy Daily
    source: sensor.nibe_electric_energy
    cycle: daily
  nibe_electric_energy_monthly:
    name: Nibe Electric Energy Monthly
    source: sensor.nibe_electric_energy
    cycle: monthly

# ── Alarm reset ─────────────────────────────────────────────────────────────
# The reset register (45171) is edge-triggered: the pump acts on the 0 → 1
# transition, so writing 1 over MQTT does nothing once it is latched at 1.
# NibePi's HTTP endpoint emits the edge correctly — use it, not the number entity.
# If you enabled Basic Auth in the NibePi UI, add username/password below.
rest_command:
  nibe_reset_alarm:
    url: http://nibepi:1880/api/alarm/reset
    method: POST
    timeout: 15
    # username: pi
    # password: !secret nibepi_password

script:
  nibe_reset_alarm:
    alias: Nibe — reset alarm
    icon: mdi:restart-alert
    mode: single
    sequence:
      - action: rest_command.nibe_reset_alarm
        response_variable: reset
      - if: "{{ (reset | default({})).get('status', 200) != 200 }}"
        then:
          - action: persistent_notification.create
            data:
              title: Nibe alarm reset failed
              message: "NibePi returned HTTP {{ reset.status }}. The pump may be disconnected or the alarm already cleared."

  nibe_hot_water_boost:
    alias: Nibe — one time hot water increase
    icon: mdi:water-boiler
    mode: single
    sequence:
      - action: select.select_option
        target:
          entity_id: select.nibe_heat_pump_nibe_temporary_lux
        data:
          option: One time increase

  nibe_hot_water_3h:
    alias: Nibe — extra hot water for 3 h
    icon: mdi:water-plus
    mode: single
    sequence:
      - action: select.select_option
        target:
          entity_id: select.nibe_heat_pump_nibe_temporary_lux
        data:
          option: 3h

  nibe_hot_water_cancel:
    alias: Nibe — cancel temporary hot water
    icon: mdi:water-off
    mode: single
    sequence:
      - action: select.select_option
        target:
          entity_id: select.nibe_heat_pump_nibe_temporary_lux
        data:
          option: 'Off'

automation:
  - alias: Nibe — notify on alarm
    id: nibe_alarm_notify
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.nibe_alarm_active
        to: 'on'
        for: "00:00:30"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: nibe_alarm
          title: >-
            Nibe alarm {{ states('sensor.nibe_heat_pump_nibe_alarm') }}
          message: >-
            {{ states('sensor.nibe_alarm_text') }}.
            Outdoor {{ states('sensor.nibe_heat_pump_nibe_bt1_outdoor_temperature') }} °C,
            supply {{ states('sensor.nibe_heat_pump_nibe_bt2_supply_temp_s1') }} °C.

  - alias: Nibe — clear alarm notification
    id: nibe_alarm_clear
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.nibe_alarm_active
        to: 'off'
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: nibe_alarm
