<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NibePi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d26;
    --border:   #2e3245;
    --text:     #e2e6f0;
    --muted:    #7a8099;
    --accent:   #4f8ef7;
    --green:    #3ecf8e;
    --red:      #f75f5f;
    --yellow:   #f7c948;
    --radius:   8px;
    --font:     'Segoe UI', system-ui, sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 20px; font-size: 12px;
    background: var(--border); color: var(--muted);
  }
  .badge.ok    { background: #1a3326; color: var(--green); }
  .badge.err   { background: #2d1a1a; color: var(--red); }
  .badge.warn  { background: #2d2510; color: var(--yellow); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* ── Tabs ── */
  nav { display: flex; gap: 2px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav button {
    padding: 10px 18px; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; font-size: 14px; font-family: var(--font); transition: color .15s;
  }
  nav button:hover  { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Main ── */
  main { padding: 24px; max-width: 900px; }
  .tab { display: none; }
  .tab.active { display: block; }

  /* ── Cards / groups ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }

  /* ── Form ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); padding: 7px 10px; font-size: 14px; font-family: var(--font);
    transition: border-color .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .toggle-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .toggle-row label { color: var(--text); font-size: 14px; }

  /* Toggle switch */
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 20px; cursor: pointer; transition: .2s;
  }
  .slider::before {
    content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px;
    background: white; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }

  /* ── Buttons ── */
  .btn {
    padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer;
    font-size: 14px; font-family: var(--font); font-weight: 500; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary  { background: var(--accent); color: white; }
  .btn-success  { background: var(--green);  color: #0a2018; }
  .btn-danger   { background: var(--red);    color: white; }
  .btn-ghost    { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }

  /* ── Status grid ── */
  .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat-card .value { font-size: 18px; font-weight: 600; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red   { color: var(--red); }
  .stat-card .value.muted { color: var(--muted); font-size: 14px; }

  /* ── Register table ── */
  .search-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .search-row input { flex: 1; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 20px;
    background: none; color: var(--muted); cursor: pointer; font-size: 12px; transition: all .15s;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .tbl-wrap { overflow-x: auto; max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; background: var(--surface); text-align: left;
    padding: 9px 12px; font-size: 12px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1;
  }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.025); }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 600;
  }
  .tag-rw { background: #1a2d3a; color: var(--accent); }
  .tag-r  { background: #1e2030; color: var(--muted); }
  .live-val { font-family: monospace; color: var(--green); font-size: 13px; }
  .live-val.stale { color: var(--muted); }
  .reg-num { font-family: monospace; font-size: 12px; color: var(--muted); }

  /* ── Chart panel ── */
  #chart-panel { display: none; margin-bottom: 16px; }
  #chart-panel.visible { display: block; }
  .sparkline-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 8px;
  }
  .sparkline-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .sparkline-title { font-size: 12px; font-weight: 600; }
  .sparkline-meta  { font-size: 11px; color: var(--muted); font-family: monospace; }
  .sparkline-svg   { width: 100%; display: block; }
  .chart-btn {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); cursor: pointer; font-size: 11px; padding: 1px 6px;
    transition: all .15s; line-height: 1.4;
  }
  .chart-btn.active { border-color: var(--accent); color: var(--accent); background: #0f2040; }

  /* ── Log viewer ── */
  #log-view {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    height: 380px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 12px;
    line-height: 1.5;
  }
  .log-line { color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .log-line.ERROR { color: var(--red); }
  .log-line.WARN  { color: var(--yellow); }
  .log-line.INFO  { color: var(--text); }
  .log-line.DEBUG { color: #5a6080; }

  .fs-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px;
    border-radius: 5px; font-weight: 600; font-size: 13px;
  }
  .fs-badge.ro { background: #2d1a1a; color: var(--red); }
  .fs-badge.rw { background: #1a3326; color: var(--green); }

  .inline-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .section-sep { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .spin { display: inline-block; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>NibePi</h1>
  <span id="hdr-pump" class="badge"><span class="dot"></span><span id="hdr-pump-text"></span></span>
  <span id="hdr-mqtt" class="badge"><span class="dot"></span><span id="hdr-mqtt-text"></span></span>
  <span id="hdr-alarm" class="badge err" style="display:none"><span class="dot"></span><span id="hdr-alarm-text"></span></span>
  <span id="hdr-model" class="badge" style="display:none"></span>
  <span id="hdr-version" class="badge" style="margin-left:auto;cursor:default"></span>
</header>

<nav>
  <button class="active" data-tab="tab-registers" data-i18n="nav.reg"></button>
  <button data-tab="tab-status"    data-i18n="nav.status"></button>
  <button data-tab="tab-settings"  data-i18n="nav.settings"></button>
</nav>

<main>

<!-- ── Settings tab ── -->
<div id="tab-settings" class="tab">

  <div class="card">
    <h2 data-i18n="set.langTitle"></h2>
    <div class="toggle-row">
      <label for="ui-lang" style="margin-right:10px" data-i18n="set.lang"></label>
      <select id="ui-lang" style="width:auto">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pl">Polski</option>
        <option value="ro">Română</option>
        <option value="nl">Nederlands</option>
        <option value="hu">Magyar</option>
        <option value="el">Ελληνικά</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="set.serialTitle"></h2>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="set.serialPort"></label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="serial-port" list="serial-ports-list" style="flex:1;min-width:0">
          <datalist id="serial-ports-list"></datalist>
          <button class="btn btn-ghost btn-sm" id="btn-scan-serial" data-i18n-title="set.scanTitle">↻</button>
          <button class="btn btn-ghost btn-sm" id="btn-test-serial" data-i18n="set.test"></button>
        </div>
        <p id="serial-test-result" class="inline-note" style="display:none;margin-top:6px"></p>
      </div>
      <div class="form-group">
        <label data-i18n="set.pumpModel"></label>
        <select id="pump-model"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-save-conn" data-i18n="set.save"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="set.mqttTitle"></h2>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="set.host"></label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="mqtt-host" list="mqtt-hosts-list" style="flex:1;min-width:0">
          <datalist id="mqtt-hosts-list"></datalist>
          <button class="btn btn-ghost btn-sm" id="btn-scan-mqtt" data-i18n-title="set.scanMqtt">↻</button>
          <button class="btn btn-ghost btn-sm" id="btn-test-mqtt" data-i18n="set.test"></button>
        </div>
        <p id="mqtt-test-result" class="inline-note" style="display:none;margin-top:6px"></p>
      </div>
      <div class="form-group">
        <label data-i18n="set.port"></label>
        <input type="number" id="mqtt-port" placeholder="1883">
      </div>
      <div class="form-group">
        <label data-i18n="set.user"></label>
        <input type="text" id="mqtt-user" autocomplete="off">
      </div>
      <div class="form-group">
        <label data-i18n="set.pass"></label>
        <input type="password" id="mqtt-pass" autocomplete="off">
      </div>
      <div class="form-group full">
        <label data-i18n="set.topic"></label>
        <input type="text" id="mqtt-topic" placeholder="nibe/modbus/">
      </div>
    </div>
    <div class="toggle-row" style="margin-top:4px">
      <label class="switch">
        <input type="checkbox" id="mqtt-enable">
        <span class="slider"></span>
      </label>
      <label for="mqtt-enable" data-i18n="set.mqttEnable"></label>
    </div>
    <div class="toggle-row" style="margin-top:10px">
      <label class="switch">
        <input type="checkbox" id="mqtt-discovery">
        <span class="slider"></span>
      </label>
      <label for="mqtt-discovery" data-i18n="set.mqttDisc"></label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-save-mqtt" data-i18n="set.save"></button>
    </div>
  </div>

</div>

<!-- ── Registers tab ── -->
<div id="tab-registers" class="tab active">
  <div class="search-row">
    <input type="text" id="reg-search">
    <button class="btn btn-ghost" id="btn-reg-refresh" data-i18n="reg.refresh"></button>
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all"    data-i18n="reg.all"></button>
    <button class="filter-btn"        data-filter="active" data-i18n="reg.active"></button>
    <button class="filter-btn"        data-filter="rw">R/W</button>
  </div>
  <div id="chart-panel"></div>
  <div class="tbl-wrap">
    <table id="reg-table">
      <thead>
        <tr>
          <th data-i18n="col.reg"></th>
          <th data-i18n="col.name"></th>
          <th data-i18n="col.unit"></th>
          <th data-i18n="col.mode"></th>
          <th data-i18n="col.val"></th>
          <th data-i18n="col.chart"></th>
          <th data-i18n="col.active"></th>
        </tr>
      </thead>
      <tbody id="reg-tbody"></tbody>
    </table>
  </div>
  <p class="inline-note" id="reg-count"></p>
</div>

<!-- ── Status & System tab ── -->
<div id="tab-status" class="tab">

  <div class="card">
    <h2 data-i18n="stat.title"></h2>
    <div class="status-grid">
      <div class="stat-card">
        <div class="label" data-i18n="stat.pump"></div>
        <div class="value" id="st-pump">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="stat.fw"></div>
        <div class="value muted" id="st-fw">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="stat.mqtt"></div>
        <div class="value" id="st-mqtt">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="stat.fs"></div>
        <div class="value" id="st-fs">—</div>
      </div>
    </div>
    <div id="alarm-row" style="display:none;margin-top:14px;align-items:center;gap:12px;flex-wrap:wrap">
      <span id="st-alarm" class="fs-badge ro"></span>
      <button class="btn btn-danger" id="btn-alarm-reset" data-i18n="stat.alarmReset"></button>
      <span id="st-alarm-hint" style="display:none;font-size:0.82em;color:var(--color-warn,#b45309)"></span>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="stat.fsTitle"></h2>
    <p id="stat-fs-desc" style="color:var(--muted);font-size:13px;margin-bottom:14px"></p>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span id="fs-status" class="fs-badge ro"></span>
      <button class="btn btn-ghost" id="btn-fs-rw" data-i18n="stat.makeRw"></button>
      <button class="btn btn-ghost" id="btn-fs-ro" data-i18n="stat.makeRo"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="log.title"></h2>
    <div class="toggle-row">
      <label for="log-level" style="margin-right:10px" data-i18n="log.level"></label>
      <select id="log-level" class="input-field" style="width:auto">
        <option value="off">Off</option>
        <option value="error">Error</option>
        <option value="warn">Warn</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" id="btn-save-log"      data-i18n="log.save"></button>
      <button class="btn btn-ghost btn-sm" id="btn-log-clear"     data-i18n="log.clear"></button>
      <button class="btn btn-ghost btn-sm" id="btn-log-download"  data-i18n="log.download"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="log.liveTitle"></h2>
    <div id="log-view"></div>
  </div>

  <hr class="section-sep">

  <div class="card">
    <h2 data-i18n="sw.title"></h2>
    <div class="status-grid" style="margin-bottom:14px">
      <div class="stat-card">
        <div class="label" data-i18n="sw.installed"></div>
        <div class="value muted" id="st-ver-current">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="sw.available"></div>
        <div class="value muted" id="st-ver-latest">—</div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:0">
      <button class="btn btn-ghost"    id="btn-ver-check"   data-i18n="sw.check"></button>
      <button class="btn btn-primary"  id="btn-ver-install" style="display:none"></button>
    </div>
    <p class="inline-note" id="ver-note"></p>
  </div>

  <hr class="section-sep">

  <div class="card">
    <h2 data-i18n="rst.title"></h2>
    <p id="rst-desc" style="color:var(--muted);font-size:13px;margin-bottom:14px"></p>
    <button class="btn btn-danger" id="btn-restart" data-i18n="rst.btn"></button>
  </div>

</div>
</main>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
let strings = {};
let currentLang = localStorage.getItem('nibepi-lang') || 'en';

async function loadLang(code) {
  try {
    const r = await fetch('/lang/' + code + '.json');
    if (!r.ok) throw new Error(r.status);
    strings = await r.json();
    currentLang = code;
  } catch {
    if (code !== 'en') await loadLang('en');
  }
}

function t(key, ...args) {
  const s = strings[key] || key;
  return args.reduce((r, a, i) => r.replace('{' + i + '}', a), s);
}

function applyLang() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  $('reg-search').placeholder = t('reg.ph');
  $('stat-fs-desc').textContent = t('stat.fsDesc');
  $('rst-desc').textContent     = t('rst.desc');
  const uiLangSel = $('ui-lang');
  if (uiLangSel) uiLangSel.value = currentLang;
}

// ── Utilities ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const qs = sel => document.querySelector(sel);

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  return r.json();
}

// ── Language selector ─────────────────────────────────────────────────────────
$('ui-lang').addEventListener('change', async () => {
  const code = $('ui-lang').value;
  localStorage.setItem('nibepi-lang', code);
  await loadLang(code);
  applyLang();
  await api('POST', '/config', { ui: { lang: code } });
});

// ── Tab navigation ────────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === id));
  if (id === 'tab-registers' && !registersLoaded) loadRegisters();
  if (id === 'tab-status') loadFsStatus();
  if (id === 'tab-settings') scanSerialPorts();
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ── SSE: status + values ──────────────────────────────────────────────────────
const liveValues = {};
let firstStatus = true;

function openEvents() {
  const es = new EventSource('/api/events');
  es.addEventListener('status', e => applyStatus(JSON.parse(e.data)));
  es.addEventListener('value',  e => {
    const d = JSON.parse(e.data);
    liveValues[d.register] = { value: d.value, unit: d.unit, ts: Date.now() };
    updateTableCell(d.register, d.value, d.unit);
  });
  es.addEventListener('history', e => {
    const hist = JSON.parse(e.data);
    for (const [addr, pts] of Object.entries(hist)) {
      const a = Number(addr);
      recordedValues[a] = pts;
      if (pts.length > 0) {
        const last = pts[pts.length - 1];
        liveValues[a] = { value: last.v, ts: last.t };
      }
    }
    if (chartedRegisters.size > 0) renderCharts();
  });
  es.addEventListener('fault', e => {
    const d = JSON.parse(e.data);
    addLogLine(`[FAULT] ${d.from}: ${d.message}`, 'WARN');
  });
  es.onerror = () => { es.close(); setTimeout(openEvents, 3000); };
}

// ── SSE: logs ─────────────────────────────────────────────────────────────────
function openLogs() {
  const es = new EventSource('/api/logs');
  es.addEventListener('log', e => addLogLine(JSON.parse(e.data)));
  es.onerror = () => setTimeout(openLogs, 3000);
}

function addLogLine(line, forceLevel) {
  const el = document.createElement('div');
  el.className = 'log-line';
  const m = line.match(/\[(ERROR|WARN |INFO |DEBUG)\]/);
  const lvl = forceLevel || (m && m[1].trim()) || '';
  el.classList.add(lvl);
  el.textContent = line;
  const view = $('log-view');
  view.appendChild(el);
  const atBottom = view.scrollHeight - view.clientHeight - view.scrollTop < 60;
  if (atBottom) view.scrollTop = view.scrollHeight;
  while (view.children.length > 500) view.removeChild(view.firstChild);
}

// ── Status application ────────────────────────────────────────────────────────
function applyStatus(s) {
  const pump = $('hdr-pump');
  pump.className = 'badge ' + (s.connected ? 'ok' : 'err');
  $('hdr-pump-text').textContent = t(s.connected ? 'hdr.pumpOk' : 'hdr.pumpErr');

  const mqtt = $('hdr-mqtt');
  mqtt.className = 'badge ' + (s.mqttConnected ? 'ok' : 'err');
  $('hdr-mqtt-text').textContent = t(s.mqttConnected ? 'hdr.mqttOk' : 'hdr.mqttErr');

  const mdl = $('hdr-model');
  if (s.model) { mdl.style.display = ''; mdl.textContent = s.model; }

  if (s.version) {
    const vb = $('hdr-version');
    vb.textContent = `v${s.version}`;
    vb.style.display = '';
    const cur = $('st-ver-current');
    if (cur) cur.textContent = `v${s.version}`;
  }

  $('st-pump').textContent = s.connected ? (s.model || t('hdr.pumpOk')) : t('hdr.pumpErr');
  $('st-pump').className   = 'value ' + (s.connected ? 'green' : 'red');
  $('st-fw').textContent   = s.firmware || '—';
  $('st-mqtt').textContent = t(s.mqttConnected ? 'hdr.mqttOk' : 'hdr.mqttErr');
  $('st-mqtt').className   = 'value ' + (s.mqttConnected ? 'green' : 'red');

  const fsEl = $('st-fs');
  fsEl.textContent = t(s.readonly ? 'stat.readonly' : 'stat.writable');
  fsEl.className   = 'value ' + (s.readonly ? 'muted' : 'green');

  const alarmActive = s.alarm && s.alarm !== 0;
  $('hdr-alarm').style.display = alarmActive ? '' : 'none';
  if (alarmActive) $('hdr-alarm-text').textContent = t('hdr.alarm', s.alarm);
  const alarmRow = $('alarm-row');
  alarmRow.style.display = alarmActive ? 'flex' : 'none';
  if (alarmActive) {
    $('st-alarm').textContent = t('stat.alarmCode', s.alarm);
    $('btn-alarm-reset').style.display = s.canReset ? '' : 'none';
    const hint = $('st-alarm-hint');
    if (s.isCommLoss) {
      hint.textContent = t('stat.alarmCommLossHint');
      hint.style.display = '';
    } else {
      hint.style.display = 'none';
    }
  }

  if (firstStatus) {
    firstStatus = false;
    switchTab(s.connected ? 'tab-registers' : 'tab-settings');
  }
}

// ── Config load ───────────────────────────────────────────────────────────────
async function loadConfig() {
  const c = await api('GET', '/config');
  $('serial-port').value = c.serial && c.serial.port || '/dev/ttyAMA0';
  await loadModelList(c.system && c.system.pump);
  const m = c.mqtt || {};
  $('mqtt-host').value        = m.host      || '';
  $('mqtt-port').value        = m.port      || '1883';
  $('mqtt-user').value        = m.user      || '';
  $('mqtt-pass').value        = m.pass      || '';
  $('mqtt-topic').value       = m.topic     || 'nibe/modbus/';
  $('mqtt-enable').checked    = !!m.enable;
  $('mqtt-discovery').checked = !!m.discovery;
  const logCfg = c.log || {};
  let logLvl = logCfg.level;
  if (logLvl === undefined) logLvl = !logCfg.enable ? 'off' : logCfg.debug ? 'debug' : 'info';
  $('log-level').value = logLvl || 'warn';
  // Apply saved language if different from what was already loaded
  const savedLang = (c.ui && c.ui.lang) || 'en';
  if (savedLang !== currentLang) {
    await loadLang(savedLang);
    applyLang();
  }
}

async function loadModelList(selectedPump) {
  const models = await api('GET', '/models');
  const sel = $('pump-model');
  const autoOpt = document.createElement('option');
  autoOpt.value = '';
  autoOpt.textContent = t('set.autoDetect');
  sel.innerHTML = '';
  sel.appendChild(autoOpt);
  for (const m of models) {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    if (m === selectedPump) opt.selected = true;
    sel.appendChild(opt);
  }
}

// ── Serial port scan + test ───────────────────────────────────────────────────
async function scanSerialPorts() {
  const dl = $('serial-ports-list');
  dl.innerHTML = '';
  try {
    const { ports } = await api('GET', '/serial-ports');
    for (const p of ports) {
      const opt = document.createElement('option');
      opt.value = p.path;
      opt.label = p.suggested ? `${p.path} ★ RS485` : p.path + (p.desc ? ` — ${p.desc}` : '');
      dl.appendChild(opt);
    }
    const rs = ports.find(p => p.suggested);
    if (rs && !$('serial-port').value) $('serial-port').value = rs.path;
  } catch {}
}

$('btn-scan-serial').addEventListener('click', scanSerialPorts);

$('btn-test-serial').addEventListener('click', async () => {
  const res = $('serial-test-result');
  res.style.display = 'block';
  res.style.color = 'var(--muted)';
  res.textContent = t('ser.testing');
  try {
    const r = await api('POST', '/serial-test', { port: $('serial-port').value });

    res.textContent = r.ok

    res.textContent = t('ser.fail', e.message);

});

// ── Registers ─────────────────────────────────────────────────────────────────
let allRegs         = [];
let registersLoaded = false;
let currentFilter   = 'all';
let searchTerm      = '';

async function loadRegisters() {
  $('reg-tbody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">${t('reg.loading')}</td></tr>`;
  allRegs = await api('GET', '/registers');
  registersLoaded = true;
  renderTable();
}

function renderTable() {
  const q = searchTerm.toLowerCase();
  const rows = allRegs.filter(r => {
    if (currentFilter === 'active' && !r.active) return false;
    if (currentFilter === 'rw'     && r.mode !== 'R/W') return false;
    if (q && !String(r.register).includes(q) && !r.titel.toLowerCase().includes(q)) return false;
    return true;
  });

  const tbody = $('reg-tbody');
  tbody.innerHTML = '';
  for (const r of rows) {
    const addr   = Number(r.register);
    const live   = liveValues[addr];
    const val    = live ? live.value : r.value;
    const valStr = val !== null && val !== undefined ? `${val}${r.unit ? ' '+r.unit : ''}` : '—';
    const stale  = !live;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="reg-num">${r.register}</td>
      <td>${escHtml(r.titel)}</td>
      <td style="color:var(--muted)">${escHtml(r.unit || '—')}</td>
      <td><span class="tag ${r.mode === 'R/W' ? 'tag-rw' : 'tag-r'}">${r.mode}</span></td>
      <td><span class="live-val${stale ? ' stale' : ''}" id="val-${addr}">${escHtml(valStr)}</span></td>
      <td>
        ${r.active ? `<button class="chart-btn${chartedRegisters.has(addr) ? ' active' : ''}" data-chart="${addr}">&#9193;</button>` : ''}
      </td>
      <td>
        <label class="switch">
          <input type="checkbox" data-reg="${addr}" ${r.active ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </td>
    `;
    tbody.appendChild(tr);
  }

  $('reg-count').textContent = t('reg.count', rows.length, allRegs.length);

  tbody.querySelectorAll('button[data-chart]').forEach(btn => {
    btn.addEventListener('click', () => toggleChart(Number(btn.dataset.chart)));
  });

  tbody.querySelectorAll('input[data-reg]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const reg = Number(cb.dataset.reg);
      if (cb.checked) {
        await api('POST', '/register/add', { register: reg });
        const r = allRegs.find(x => Number(x.register) === reg);
        if (r) r.active = true;
      } else {
        await api('POST', '/register/remove', { register: reg });
        const r = allRegs.find(x => Number(x.register) === reg);
        if (r) r.active = false;
      }
    });
  });
}

function updateTableCell(register, value, unit) {
  const el = $(`val-${register}`);
  if (el) {
    el.textContent = `${value}${unit ? ' '+unit : ''}`;
    el.classList.remove('stale');
    el.style.transition = 'none';
    el.style.color = 'var(--accent)';
    setTimeout(() => { el.style.transition = 'color .6s'; el.style.color = ''; }, 100);
  }
  if (chartedRegisters.has(register)) {
    if (!recordedValues[register]) recordedValues[register] = [];
    recordedValues[register].push({ t: Date.now(), v: value });
    if (recordedValues[register].length > MAX_HISTORY) recordedValues[register].shift();
    scheduleChartRender();
  }
}

$('reg-search').addEventListener('input', e => { searchTerm = e.target.value; renderTable(); });

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  let toast = $('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    Object.assign(toast.style, {
      position: 'fixed', bottom: '24px', right: '24px',
      background: 'var(--green)', color: '#0a2018',
      padding: '10px 18px', borderRadius: '6px',
      fontWeight: '600', fontSize: '13px', zIndex: '9999',
      transition: 'opacity .3s',
    });
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2500);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

      $('st-ver-latest').className = 'value muted';
      $('btn-ver-install').style.display = 'none';
      $('ver-note').textContent = t('sw.upToDate');

// ── Chart ─────────────────────────────────────────────────────────────────────
const MAX_HISTORY      = 200;
const chartedRegisters = new Set();
const recordedValues   = {};
const CHART_COLORS     = ['#4f8ef7','#3ecf8e','#f7c948','#f75f5f','#a78bfa','#f97316','#06b6d4','#84cc16'];
let   chartColorIdx    = 0;
const regColors        = {};
let   chartRafPending  = false;

function scheduleChartRender() {
  if (chartRafPending) return;
  chartRafPending = true;
  requestAnimationFrame(() => { chartRafPending = false; renderCharts(); });
}

function toggleChart(addr) {
  if (chartedRegisters.has(addr)) {
    chartedRegisters.delete(addr);
  } else {
    chartedRegisters.add(addr);
    if (!regColors[addr]) {
      regColors[addr] = CHART_COLORS[chartColorIdx % CHART_COLORS.length];
      chartColorIdx++;
    }
    if (!recordedValues[addr]) recordedValues[addr] = [];
  }
  document.querySelectorAll('button[data-chart]').forEach(btn => {
    const a = Number(btn.dataset.chart);
    btn.classList.toggle('active', chartedRegisters.has(a));
  });
  renderCharts();
}

function renderCharts() {
  const panel = $('chart-panel');
  if (chartedRegisters.size === 0) { panel.className = ''; panel.innerHTML = ''; return; }
  panel.className = 'visible';

  const regs  = [...chartedRegisters];
  const W     = 600, H = 72, PAD_L = 52, PAD_R = 8, PAD_V = 8;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_V * 2;

  let gTmin = Infinity, gTmax = -Infinity;
  for (const addr of regs) {
    for (const p of (recordedValues[addr] || [])) {
      if (p.t < gTmin) gTmin = p.t;
      if (p.t > gTmax) gTmax = p.t;
    }
  }
  if (!isFinite(gTmin)) gTmin = gTmax = Date.now();
  const gRange = gTmax - gTmin || 1;

  const fmtDur = ms => {
    const s = Math.round(ms / 1000);
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}min` : `${(s / 3600).toFixed(1)}h`;
  };
  const toX = ts => PAD_L + ((ts - gTmin) / gRange) * plotW;

  const ruler = `<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:2px ${PAD_R}px 4px ${PAD_L}px">
    <span>${t('chart.ago', fmtDur(Date.now() - gTmin))}</span>
    <span style="opacity:.5">↔ ${fmtDur(gTmax - gTmin)}</span>
    <span>${t('chart.now')}</span>
  </div>`;

  const html = regs.map(addr => {
    const pts    = recordedValues[addr] || [];
    const reg    = allRegs.find(r => Number(r.register) === addr);
    const title  = reg ? reg.titel : `#${addr}`;
    const unit   = reg ? (reg.unit || '') : '';
    const color  = regColors[addr] || '#4f8ef7';
    const closeBtn = `<button class="chart-btn" onclick="toggleChart(${addr})" title="${t('chart.close')}">×</button>`;

    if (pts.length < 2) {
      return `<div class="sparkline-wrap">
        <div class="sparkline-header">
          <span class="sparkline-title" style="color:${color}">${escHtml(title)}</span>
          <span class="sparkline-meta">${t('chart.waiting')}</span>
          ${closeBtn}
        </div>
      </div>`;
    }

    const vals  = pts.map(p => p.v);
    const minV  = Math.min(...vals);
    const maxV  = Math.max(...vals);
    const range = maxV - minV || 1;
    const cur   = vals[vals.length - 1];
    const toY   = v => PAD_V + plotH - ((v - minV) / range) * plotH;

    const points     = pts.map(p => `${toX(p.t).toFixed(1)},${toY(p.v).toFixed(1)}`).join(' ');
    const firstX     = toX(pts[0].t).toFixed(1);
    const lastX      = toX(pts[pts.length - 1].t).toFixed(1);
    const lastY      = toY(cur).toFixed(1);
    const areaPoints = `${firstX},${H - PAD_V} ${points} ${lastX},${H - PAD_V}`;

    const yTop = PAD_V + 4;
    const yBot = H - PAD_V - 2;
    const yMid = (yTop + yBot) / 2;

    return `<div class="sparkline-wrap">
      <div class="sparkline-header">
        <span class="sparkline-title" style="color:${color}">${escHtml(title)}</span>
        <span class="sparkline-meta">${cur} ${escHtml(unit)} &nbsp;&middot;&nbsp; ↓${minV} ↑${maxV} &nbsp;&middot;&nbsp; ${pts.length} pts</span>
        ${closeBtn}
      </div>
      <svg class="sparkline-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="sg${addr}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="${color}" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <line x1="${PAD_L}" y1="${yTop}" x2="${W - PAD_R}" y2="${yTop}" stroke="var(--border)" stroke-width="0.5"/>
        <line x1="${PAD_L}" y1="${yMid}" x2="${W - PAD_R}" y2="${yMid}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>
        <line x1="${PAD_L}" y1="${yBot}" x2="${W - PAD_R}" y2="${yBot}" stroke="var(--border)" stroke-width="0.5"/>
        <text x="${PAD_L - 4}" y="${yTop + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${maxV}</text>
        <text x="${PAD_L - 4}" y="${yMid + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${((minV + maxV) / 2).toFixed(1)}</text>
        <text x="${PAD_L - 4}" y="${yBot + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${minV}</text>
        <polygon points="${areaPoints}" fill="url(#sg${addr})"/>
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="2.5" fill="${color}"/>
      </svg>
    </div>`;
  }).join('');

  panel.innerHTML = ruler + html;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadLang(currentLang).then(() => { applyLang(); loadConfig(); openEvents(); openLogs(); });
