<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1117">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>NibePi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d26;
    --border:   #2e3245;
    --text:     #e2e6f0;
    --muted:    #7a8099;
    --accent:   #4f8ef7;
    --green:    #3ecf8e;
    --red:      #f75f5f;
    --yellow:   #f7c948;
    --radius:   8px;
    --font:     'Segoe UI', system-ui, sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 20px; font-size: 12px;
    background: var(--border); color: var(--muted);
  }
  .badge.ok    { background: #1a3326; color: var(--green); }
  .badge.err   { background: #2d1a1a; color: var(--red); }
  .badge.warn  { background: #2d2510; color: var(--yellow); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* ── Tabs ── */
  nav { display: flex; gap: 2px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  nav button {
    padding: 10px 18px; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); cursor: pointer; font-size: 14px; font-family: var(--font); transition: color .15s;
  }
  nav button:hover  { color: var(--text); }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Main ── */
  main { padding: 24px; max-width: 900px; }
  .tab { display: none; }
  .tab.active { display: block; }

  /* ── Cards / groups ── */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 16px; }

  /* ── Form ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); padding: 7px 10px; font-size: 14px; font-family: var(--font);
    transition: border-color .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .toggle-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
  .toggle-row label { color: var(--text); font-size: 14px; }

  /* Toggle switch */
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 20px; cursor: pointer; transition: .2s;
  }
  .slider::before {
    content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px;
    background: white; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(16px); }

  /* ── Buttons ── */
  .btn {
    padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer;
    font-size: 14px; font-family: var(--font); font-weight: 500; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary  { background: var(--accent); color: white; }
  .btn-success  { background: var(--green);  color: #0a2018; }
  .btn-danger   { background: var(--red);    color: white; }
  .btn-ghost    { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }

  /* ── Status grid ── */
  .status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat-card .value { font-size: 18px; font-weight: 600; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red   { color: var(--red); }
  .stat-card .value.muted { color: var(--muted); font-size: 14px; }

  /* ── Register table ── */
  .search-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .search-row input { flex: 1; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 20px;
    background: none; color: var(--muted); cursor: pointer; font-size: 12px; transition: all .15s;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .tbl-wrap { overflow-x: auto; max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; background: var(--surface); text-align: left;
    padding: 9px 12px; font-size: 12px; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1;
  }
  td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.025); }
  .tag {
    display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 600;
  }
  .tag-rw { background: #1a2d3a; color: var(--accent); }
  .tag-r  { background: #1e2030; color: var(--muted); }
  .live-val { font-family: monospace; color: var(--green); font-size: 13px; }
  .live-val.stale { color: var(--muted); }
  .reg-num { font-family: monospace; font-size: 12px; color: var(--muted); }

  /* ── Chart panel ── */
  #chart-panel { display: none; margin-bottom: 16px; }
  #chart-panel.visible { display: block; }
  .sparkline-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 8px; position: relative;
  }
  #mem-chart-wrap { position: relative; }
  .chart-tooltip {
    position: absolute; pointer-events: none; z-index: 10;
    background: #1a1d2e; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 9px; font-size: 12px; font-family: monospace;
    white-space: nowrap; line-height: 1.5;
  }
  .sparkline-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .sparkline-title { font-size: 12px; font-weight: 600; }
  .sparkline-meta  { font-size: 11px; color: var(--muted); font-family: monospace; }
  .sparkline-svg   { width: 100%; display: block; }
  .chart-btn {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); cursor: pointer; font-size: 11px; padding: 1px 6px;
    transition: all .15s; line-height: 1.4;
  }
  .chart-btn.active { border-color: var(--accent); color: var(--accent); background: #0f2040; }

  /* ── Log viewer ── */
  #log-view {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    height: 380px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 12px;
    line-height: 1.5;
  }
  .log-line { color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .log-line.ERROR { color: var(--red); }
  .log-line.WARN  { color: var(--yellow); }
  .log-line.INFO  { color: var(--text); }
  .log-line.DEBUG { color: #5a6080; }

  .fs-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px;
    border-radius: 5px; font-weight: 600; font-size: 13px;
  }
  .fs-badge.ro { background: #2d1a1a; color: var(--red); }
  .fs-badge.rw { background: #1a3326; color: var(--green); }

  .inline-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .section-sep { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .spin { display: inline-block; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true">
    <defs>
      <linearGradient id="logo-cold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8ab8ff"/>
        <stop offset="1" stop-color="#4f8ef7"/>
      </linearGradient>
      <linearGradient id="logo-warm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f7c948"/>
        <stop offset="1" stop-color="#f7755f"/>
      </linearGradient>
    </defs>
    <g transform="translate(24 24)" fill="none" stroke="url(#logo-cold)" stroke-width="8" stroke-linecap="round">
      <path d="M0 -17A17 17 0 0 1 17 0"/>
      <path d="M0 -17A17 17 0 0 1 17 0" transform="rotate(120)"/>
      <path d="M0 -17A17 17 0 0 1 17 0" transform="rotate(240)"/>
    </g>
    <circle cx="24" cy="24" r="6" fill="url(#logo-warm)"/>
  </svg>
  <h1>NibePi</h1>
  <span id="hdr-pump" class="badge"><span class="dot"></span><span id="hdr-pump-text"></span></span>
  <span id="hdr-mqtt" class="badge"><span class="dot"></span><span id="hdr-mqtt-text"></span></span>
  <span id="hdr-alarm" class="badge err" style="display:none"><span class="dot"></span><span id="hdr-alarm-text"></span></span>
  <span id="hdr-model" class="badge" style="display:none"></span>
  <span id="hdr-version" class="badge" style="margin-left:auto;cursor:default"></span>
  <span id="hdr-update" class="badge warn" style="display:none;cursor:pointer" title=""><span class="dot"></span><span id="hdr-update-text"></span></span>
</header>

<nav>
  <button class="active" data-tab="tab-registers" data-i18n="nav.reg"></button>
  <button data-tab="tab-status"    data-i18n="nav.status"></button>
  <button data-tab="tab-settings"  data-i18n="nav.settings"></button>
</nav>

<main>

<!-- ── Settings tab ── -->
<div id="tab-settings" class="tab">

  <div class="card">
    <h2 data-i18n="set.langTitle"></h2>
    <div class="toggle-row">
      <label for="ui-lang" style="margin-right:10px" data-i18n="set.lang"></label>
      <select id="ui-lang" style="width:auto">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="nl">Nederlands</option>
        <option value="pt">Português</option>
        <option value="sv">Svenska</option>
        <option value="no">Norsk</option>
        <option value="da">Dansk</option>
        <option value="fi">Suomi</option>
        <option value="pl">Polski</option>
        <option value="cs">Čeština</option>
        <option value="sk">Slovenčina</option>
        <option value="sl">Slovenščina</option>
        <option value="hr">Hrvatski</option>
        <option value="ro">Română</option>
        <option value="hu">Magyar</option>
        <option value="el">Ελληνικά</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="set.serialTitle"></h2>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="set.serialPort"></label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="serial-port" list="serial-ports-list" style="flex:1;min-width:0">
          <datalist id="serial-ports-list"></datalist>
          <button class="btn btn-ghost btn-sm" id="btn-scan-serial" data-i18n-title="set.scanTitle">↻</button>
          <button class="btn btn-ghost btn-sm" id="btn-test-serial" data-i18n="set.test"></button>
        </div>
        <p id="serial-test-result" class="inline-note" style="display:none;margin-top:6px"></p>
      </div>
      <div class="form-group">
        <label data-i18n="set.pumpModel"></label>
        <select id="pump-model"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-save-conn" data-i18n="set.save"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="set.mqttTitle"></h2>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="set.host"></label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="mqtt-host" list="mqtt-hosts-list" style="flex:1;min-width:0">
          <datalist id="mqtt-hosts-list"></datalist>
          <button class="btn btn-ghost btn-sm" id="btn-scan-mqtt" data-i18n-title="set.scanMqtt">↻</button>
          <button class="btn btn-ghost btn-sm" id="btn-test-mqtt" data-i18n="set.test"></button>
        </div>
        <p id="mqtt-test-result" class="inline-note" style="display:none;margin-top:6px"></p>
      </div>
      <div class="form-group">
        <label data-i18n="set.port"></label>
        <input type="number" id="mqtt-port" placeholder="1883">
      </div>
      <div class="form-group">
        <label data-i18n="set.user"></label>
        <input type="text" id="mqtt-user" autocomplete="off">
      </div>
      <div class="form-group">
        <label data-i18n="set.pass"></label>
        <input type="password" id="mqtt-pass" autocomplete="off">
      </div>
      <div class="form-group full">
        <label data-i18n="set.topic"></label>
        <input type="text" id="mqtt-topic" placeholder="nibe/modbus/">
      </div>
    </div>
    <div class="toggle-row" style="margin-top:4px">
      <label class="switch">
        <input type="checkbox" id="mqtt-tls">
        <span class="slider"></span>
      </label>
      <label for="mqtt-tls" data-i18n="set.mqttTls"></label>
    </div>
    <div id="mqtt-tls-extra" style="display:none;margin-top:10px">
      <div class="form-group">
        <label data-i18n="set.mqttCaFile"></label>
        <input type="text" id="mqtt-cafile" placeholder="/etc/nibepi/ca.crt">
      </div>
    </div>
    <div class="toggle-row" style="margin-top:10px">
      <label class="switch">
        <input type="checkbox" id="mqtt-enable">
        <span class="slider"></span>
      </label>
      <label for="mqtt-enable" data-i18n="set.mqttEnable"></label>
    </div>
    <div class="toggle-row" style="margin-top:10px">
      <label class="switch">
        <input type="checkbox" id="mqtt-discovery">
        <span class="slider"></span>
      </label>
      <label for="mqtt-discovery" data-i18n="set.mqttDisc"></label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-save-mqtt" data-i18n="set.save"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="set.backupTitle"></h2>
    <div class="btn-row" style="margin-top:0">
      <a id="btn-config-export" class="btn btn-ghost" data-i18n="set.backupExport" href="/api/config/export" download="nibepi-config.json"></a>
      <label class="btn btn-ghost" style="cursor:pointer">
        <span data-i18n="set.backupImport"></span>
        <input type="file" id="config-import-file" accept=".json" style="display:none">
      </label>
    </div>
    <p id="import-note" class="inline-note" style="display:none"></p>
  </div>

  <div class="card">
    <h2 data-i18n="set.authTitle"></h2>
    <p id="auth-desc" style="color:var(--muted);font-size:13px;margin-bottom:14px" data-i18n="set.authDesc"></p>
    <div class="form-grid">
      <div class="form-group">
        <label data-i18n="set.authUser"></label>
        <input type="text" id="auth-user" autocomplete="username">
      </div>
      <div class="form-group">
        <label data-i18n="set.authPass"></label>
        <input type="password" id="auth-pass" autocomplete="new-password">
      </div>
    </div>
    <div class="toggle-row" style="margin-top:8px">
      <label class="switch">
        <input type="checkbox" id="auth-enable">
        <span class="slider"></span>
      </label>
      <label for="auth-enable" data-i18n="set.authEnable"></label>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-save-auth" data-i18n="set.save"></button>
    </div>
  </div>

</div>

<!-- ── Registers tab ── -->
<div id="tab-registers" class="tab active">
  <div class="search-row">
    <input type="text" id="reg-search">
    <button class="btn btn-ghost" id="btn-reg-refresh" data-i18n="reg.refresh"></button>
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all"    data-i18n="reg.all"></button>
    <button class="filter-btn"        data-filter="active" data-i18n="reg.active"></button>
    <button class="filter-btn"        data-filter="rw">R/W</button>
  </div>
  <div id="chart-panel"></div>
  <div class="tbl-wrap">
    <table id="reg-table">
      <thead>
        <tr>
          <th data-i18n="col.reg"></th>
          <th data-i18n="col.name"></th>
          <th data-i18n="col.unit"></th>
          <th data-i18n="col.mode"></th>
          <th data-i18n="col.val"></th>
          <th></th>
          <th data-i18n="col.chart"></th>
          <th data-i18n="col.active"></th>
        </tr>
      </thead>
      <tbody id="reg-tbody"></tbody>
    </table>
  </div>
  <p class="inline-note" id="reg-count"></p>
</div>

<!-- ── Status & System tab ── -->
<div id="tab-status" class="tab">

  <div class="card">
    <h2 data-i18n="stat.title"></h2>
    <div class="status-grid">
      <div class="stat-card">
        <div class="label" data-i18n="stat.pump"></div>
        <div class="value" id="st-pump">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="stat.fw"></div>
        <div class="value muted" id="st-fw">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="stat.mqtt"></div>
        <div class="value" id="st-mqtt">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="stat.fs"></div>
        <div class="value" id="st-fs">—</div>
      </div>
    </div>
    <div id="alarm-row" style="display:none;margin-top:14px;align-items:center;gap:12px;flex-wrap:wrap">
      <span id="st-alarm" class="fs-badge ro"></span>
      <button class="btn btn-danger" id="btn-alarm-reset" data-i18n="stat.alarmReset"></button>
      <span id="st-alarm-hint" style="display:none;font-size:0.82em;color:var(--color-warn,#b45309)" data-i18n="stat.alarm251Hint"></span>
    </div>
  </div>

  <div class="card" id="alarm-history-card" style="display:none">
    <h2 data-i18n="stat.alarmHistory"></h2>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead>
        <tr>
          <th style="text-align:left;padding:4px 8px;color:var(--muted);font-weight:500" data-i18n="col.reg"></th>
          <th style="text-align:left;padding:4px 8px;color:var(--muted);font-weight:500" data-i18n="stat.alarmStart"></th>
          <th style="text-align:left;padding:4px 8px;color:var(--muted);font-weight:500" data-i18n="stat.alarmEnd"></th>
        </tr>
      </thead>
      <tbody id="alarm-history-tbody"></tbody>
    </table>
    <p id="alarm-history-empty" style="color:var(--muted);font-size:13px;display:none" data-i18n="stat.alarmNoHistory"></p>
  </div>

  <div class="card">
    <h2 data-i18n="stat.memTitle"></h2>
    <div id="mem-chart-wrap"></div>
  </div>

  <div class="card">
    <h2 data-i18n="stat.fsTitle"></h2>
    <p id="stat-fs-desc" style="color:var(--muted);font-size:13px;margin-bottom:14px"></p>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span id="fs-status" class="fs-badge ro"></span>
      <button class="btn btn-ghost" id="btn-fs-rw" data-i18n="stat.makeRw"></button>
      <button class="btn btn-ghost" id="btn-fs-ro" data-i18n="stat.makeRo"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="sw.title"></h2>
    <div class="status-grid" style="margin-bottom:14px">
      <div class="stat-card">
        <div class="label" data-i18n="sw.installed"></div>
        <div class="value muted" id="st-ver-current">—</div>
      </div>
      <div class="stat-card">
        <div class="label" data-i18n="sw.available"></div>
        <div class="value muted" id="st-ver-latest">—</div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:0">
      <button class="btn btn-ghost"    id="btn-ver-check"   data-i18n="sw.check"></button>
      <button class="btn btn-primary"  id="btn-ver-install" style="display:none"></button>
    </div>
    <p class="inline-note" id="ver-note"></p>
  </div>

  <hr class="section-sep">

  <div class="card">
    <h2 data-i18n="rst.title"></h2>
    <p id="rst-desc" style="color:var(--muted);font-size:13px;margin-bottom:14px"></p>
    <button class="btn btn-danger" id="btn-restart" data-i18n="rst.btn"></button>
  </div>

  <hr class="section-sep">

  <div class="card">
    <h2 data-i18n="log.title"></h2>
    <div class="toggle-row">
      <label for="log-level" style="margin-right:10px" data-i18n="log.level"></label>
      <select id="log-level" class="input-field" style="width:auto">
        <option value="off">Off</option>
        <option value="error">Error</option>
        <option value="warn">Warn</option>
        <option value="info">Info</option>
        <option value="debug">Debug</option>
      </select>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-ghost btn-sm" id="btn-save-log"      data-i18n="log.save"></button>
      <button class="btn btn-ghost btn-sm" id="btn-log-clear"     data-i18n="log.clear"></button>
      <button class="btn btn-ghost btn-sm" id="btn-log-download"  data-i18n="log.download"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="log.liveTitle"></h2>
    <div id="log-view"></div>
  </div>

</div>
</main>

<script>
// ── i18n ──────────────────────────────────────────────────────────────────────
let strings = {};
let currentLang = localStorage.getItem('nibepi-lang') || 'en';
let alarmDescs = {};

async function loadAlarmDescs() {
  try {
    const r = await fetch('/api/alarms');
    if (r.ok) alarmDescs = await r.json();
  } catch {}
}

function alarmDesc(code) {
  return alarmDescs[String(code)] || '';
}

async function loadLang(code) {
  try {
    const r = await fetch('/lang/' + code + '.json');
    if (!r.ok) throw new Error(r.status);
    strings = await r.json();
    currentLang = code;
  } catch {
    if (code !== 'en') await loadLang('en');
  }
}

function t(key, ...args) {
  const s = strings[key] || key;
  return args.reduce((r, a, i) => r.replace('{' + i + '}', a), s);
}

function applyLang() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  $('reg-search').placeholder = t('reg.ph');
  $('stat-fs-desc').textContent = t('stat.fsDesc');
  $('rst-desc').textContent     = t('rst.desc');
  const uiLangSel = $('ui-lang');
  if (uiLangSel) uiLangSel.value = currentLang;
}

// ── Utilities ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const qs = sel => document.querySelector(sel);

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  return r.json();
}

// ── Language selector ─────────────────────────────────────────────────────────
$('ui-lang').addEventListener('change', async () => {
  const code = $('ui-lang').value;
  localStorage.setItem('nibepi-lang', code);
  await loadLang(code);
  applyLang();
  await api('POST', '/config', { ui: { lang: code } });
});

// ── Tab navigation ────────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === id));
  if (id === 'tab-registers' && !registersLoaded) loadRegisters();
  if (id === 'tab-status') { loadFsStatus(); loadMemChart(); loadAlarmHistory(); }
  else if (_memLiveTimer) { clearInterval(_memLiveTimer); _memLiveTimer = null; }
  if (id === 'tab-settings') scanSerialPorts();
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ── SSE: status + values ──────────────────────────────────────────────────────
const liveValues = {};
let firstStatus = true;

function openEvents() {
  const es = new EventSource('/api/events');
  es.addEventListener('status', e => applyStatus(JSON.parse(e.data)));
  es.addEventListener('value',  e => {
    const d = JSON.parse(e.data);
    liveValues[d.register] = { value: d.value, unit: d.unit, ts: Date.now() };
    updateTableCell(d.register, d.value, d.unit);
  });
  es.addEventListener('fault', e => {
    const d = JSON.parse(e.data);
    addLogLine(`[FAULT] ${d.from}: ${d.message}`, 'WARN');
  });
  es.onerror = () => { es.close(); setTimeout(openEvents, 3000); };
}

// ── SSE: logs ─────────────────────────────────────────────────────────────────
function openLogs() {
  const es = new EventSource('/api/logs');
  es.addEventListener('log', e => addLogLine(JSON.parse(e.data)));
  es.onerror = () => setTimeout(openLogs, 3000);
}

function addLogLine(line, forceLevel) {
  const el = document.createElement('div');
  el.className = 'log-line';
  const m = line.match(/\[(ERROR|WARN |INFO |DEBUG)\]/);
  const lvl = forceLevel || (m && m[1].trim()) || '';
  el.classList.add(lvl);
  el.textContent = line;
  const view = $('log-view');
  view.appendChild(el);
  const atBottom = view.scrollHeight - view.clientHeight - view.scrollTop < 60;
  if (atBottom) view.scrollTop = view.scrollHeight;
  while (view.children.length > 500) view.removeChild(view.firstChild);
}

// ── Status application ────────────────────────────────────────────────────────
function applyStatus(s) {
  const pump = $('hdr-pump');
  pump.className = 'badge ' + (s.connected ? 'ok' : 'err');
  $('hdr-pump-text').textContent = t(s.connected ? 'hdr.pumpOk' : 'hdr.pumpErr');

  const mqtt = $('hdr-mqtt');
  mqtt.className = 'badge ' + (s.mqttConnected ? 'ok' : 'err');
  $('hdr-mqtt-text').textContent = t(s.mqttConnected ? 'hdr.mqttOk' : 'hdr.mqttErr');

  const mdl = $('hdr-model');
  if (s.model) { mdl.style.display = ''; mdl.textContent = s.model; }

  if (s.version) {
    const vb = $('hdr-version');
    vb.textContent = `v${s.version}`;
    vb.style.display = '';
    const cur = $('st-ver-current');
    if (cur) cur.textContent = `v${s.version}`;
  }

  const updateBadge = $('hdr-update');
  if (s.updateAvailable && s.latestVersion) {
    $('hdr-update-text').textContent = t('hdr.updateAvailable', s.latestVersion);
    updateBadge.title = t('hdr.updateAvailable', s.latestVersion);
    updateBadge.style.display = '';
    updateBadge.onclick = () => switchTab('tab-status');
  } else {
    updateBadge.style.display = 'none';
  }

  $('st-pump').textContent = s.connected ? (s.model || t('hdr.pumpOk')) : t('hdr.pumpErr');
  $('st-pump').className   = 'value ' + (s.connected ? 'green' : 'red');
  $('st-fw').textContent   = s.firmware || '—';
  $('st-mqtt').textContent = t(s.mqttConnected ? 'hdr.mqttOk' : 'hdr.mqttErr');
  $('st-mqtt').className   = 'value ' + (s.mqttConnected ? 'green' : 'red');

  const fsEl = $('st-fs');
  fsEl.textContent = t(s.readonly ? 'stat.readonly' : 'stat.writable');
  fsEl.className   = 'value ' + (s.readonly ? 'muted' : 'green');

  const alarmActive = s.alarm && s.alarm !== 0;
  $('hdr-alarm').style.display = alarmActive ? '' : 'none';
  if (alarmActive) {
    const desc = alarmDesc(s.alarm);
    $('hdr-alarm-text').textContent = desc
      ? t('hdr.alarm', s.alarm) + ' – ' + desc
      : t('hdr.alarm', s.alarm);
  }
  const alarmRow = $('alarm-row');
  alarmRow.style.display = alarmActive ? 'flex' : 'none';
  if (alarmActive) {
    const desc = alarmDesc(s.alarm);
    $('st-alarm').textContent = desc
      ? t('stat.alarmCode', s.alarm) + ' – ' + desc
      : t('stat.alarmCode', s.alarm);
    const resetBtn = $('btn-alarm-reset');
    resetBtn.style.display = s.canReset ? '' : 'none';
    const hint = $('st-alarm-hint');
    hint.style.display = s.alarm === 251 ? '' : 'none';
  }

  if (firstStatus) {
    firstStatus = false;
    switchTab(s.connected ? 'tab-registers' : 'tab-settings');
  }
}

// ── Config load ───────────────────────────────────────────────────────────────
async function loadConfig() {
  const c = await api('GET', '/config');
  $('serial-port').value = c.serial && c.serial.port || '/dev/ttyAMA0';
  await loadModelList(c.system && c.system.pump);
  const m = c.mqtt || {};
  $('mqtt-host').value        = m.host      || '';
  $('mqtt-port').value        = m.port      || '1883';
  $('mqtt-user').value        = m.user      || '';
  $('mqtt-pass').value        = m.pass      || '';
  $('mqtt-topic').value       = m.topic     || 'nibe/modbus/';
  $('mqtt-enable').checked    = !!m.enable;
  $('mqtt-discovery').checked = !!m.discovery;
  $('mqtt-tls').checked       = !!m.tls;
  $('mqtt-cafile').value      = m.tlsCaFile || '';
  $('mqtt-tls-extra').style.display = m.tls ? '' : 'none';
  const logCfg = c.log || {};
  let logLvl = logCfg.level;
  if (logLvl === undefined) logLvl = !logCfg.enable ? 'off' : logCfg.debug ? 'debug' : 'info';
  $('log-level').value = logLvl || 'warn';
  const authCfg = c.auth || {};
  $('auth-user').value    = authCfg.user  || '';
  $('auth-pass').value    = authCfg.pass  || '';
  $('auth-enable').checked = !!authCfg.enable;
  updateAuthToggle();
  // Apply saved language if different from what was already loaded
  const savedLang = (c.ui && c.ui.lang) || 'en';
  if (savedLang !== currentLang) {
    await loadLang(savedLang);
    applyLang();
  }
}

async function loadModelList(selectedPump) {
  const models = await api('GET', '/models');
  const sel = $('pump-model');
  const autoOpt = document.createElement('option');
  autoOpt.value = '';
  autoOpt.textContent = t('set.autoDetect');
  sel.innerHTML = '';
  sel.appendChild(autoOpt);
  for (const m of models) {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    if (m === selectedPump) opt.selected = true;
    sel.appendChild(opt);
  }
}

// ── Connection save ───────────────────────────────────────────────────────────
$('btn-save-conn').addEventListener('click', async () => {
  const pump = $('pump-model').value;
  const patch = { serial: { port: $('serial-port').value }, system: {} };
  if (pump) patch.system.pump = pump;
  await api('POST', '/config', patch);
  showToast(t('toast.conn'));
});

// ── MQTT TLS toggle ───────────────────────────────────────────────────────────
$('mqtt-tls').addEventListener('change', () => {
  const on = $('mqtt-tls').checked;
  $('mqtt-tls-extra').style.display = on ? '' : 'none';
  if (on && ($('mqtt-port').value === '1883' || !$('mqtt-port').value))
    $('mqtt-port').value = '8883';
  else if (!on && $('mqtt-port').value === '8883')
    $('mqtt-port').value = '1883';
});

// ── MQTT save ─────────────────────────────────────────────────────────────────
$('btn-save-mqtt').addEventListener('click', async () => {
  await api('POST', '/config', {
    mqtt: {
      enable:    $('mqtt-enable').checked,
      host:      $('mqtt-host').value,
      port:      $('mqtt-port').value,
      user:      $('mqtt-user').value,
      pass:      $('mqtt-pass').value,
      topic:     $('mqtt-topic').value,
      discovery: $('mqtt-discovery').checked,
      tls:       $('mqtt-tls').checked,
      tlsCaFile: $('mqtt-cafile').value.trim(),
    }
  });
  showToast(t('toast.mqtt'));
});

// ── Config import ─────────────────────────────────────────────────────────────
$('config-import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const note = $('import-note');
  try {
    const text = await file.text();
    const json = JSON.parse(text);
    await api('POST', '/config/import', json);
    note.style.display = '';
    note.style.color = 'var(--green)';
    note.textContent = t('toast.import');
    await loadConfig();
  } catch (err) {
    note.style.display = '';
    note.style.color = 'var(--color-warn,#b45309)';
    note.textContent = err.message;
  }
  e.target.value = '';
});

// ── Auth settings ─────────────────────────────────────────────────────────────
function updateAuthToggle() {
  const hasCredentials = $('auth-user').value.trim() && $('auth-pass').value.trim();
  $('auth-enable').disabled = !hasCredentials;
  if (!hasCredentials) $('auth-enable').checked = false;
}

$('auth-user').addEventListener('input', updateAuthToggle);
$('auth-pass').addEventListener('input', updateAuthToggle);

$('btn-save-auth').addEventListener('click', async () => {
  await api('POST', '/config', {
    auth: {
      enable: $('auth-enable').checked,
      user:   $('auth-user').value.trim(),
      pass:   $('auth-pass').value.trim(),
    }
  });
  showToast(t('toast.auth'));
});

// ── Serial port scan + test ───────────────────────────────────────────────────
async function scanSerialPorts() {
  const dl = $('serial-ports-list');
  dl.innerHTML = '';
  try {
    const { ports } = await api('GET', '/serial-ports');
    for (const p of ports) {
      const opt = document.createElement('option');
      opt.value = p.path;
      opt.label = p.suggested ? `${p.path} ★ RS485` : p.path + (p.desc ? ` — ${p.desc}` : '');
      dl.appendChild(opt);
    }
    const rs = ports.find(p => p.suggested);
    if (rs && !$('serial-port').value) $('serial-port').value = rs.path;
  } catch {}
}

$('btn-scan-serial').addEventListener('click', scanSerialPorts);

$('btn-test-serial').addEventListener('click', async () => {
  const res = $('serial-test-result');
  res.style.display = 'block';
  res.style.color = 'var(--muted)';
  res.textContent = t('ser.testing');
  try {
    const r = await api('POST', '/serial-test', { port: $('serial-port').value });
    res.style.color = r.ok ? 'var(--green)' : 'var(--red)';
    res.textContent = r.ok
      ? (r.note ? t('ser.okNote', r.note) : t('ser.ok'))
      : t('ser.fail', r.error);
  } catch (e) {
    res.style.color = 'var(--red)';
    res.textContent = t('ser.fail', e.message);
  }
});

// ── MQTT scan + test ──────────────────────────────────────────────────────────
async function scanMqttHosts() {
  const btn = $('btn-scan-mqtt');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const { hosts } = await api('GET', '/mqtt-scan');
    const dl = $('mqtt-hosts-list');
    dl.innerHTML = '';
    for (const h of hosts) {
      const opt = document.createElement('option');
      opt.value = h;
      dl.appendChild(opt);
    }
    if (hosts.length > 0 && !$('mqtt-host').value) $('mqtt-host').value = hosts[0];
  } catch {}
  btn.disabled = false;
  btn.textContent = '↻';
}

$('btn-scan-mqtt').addEventListener('click', scanMqttHosts);

$('btn-test-mqtt').addEventListener('click', async () => {
  const res = $('mqtt-test-result');
  res.style.display = 'block';
  res.style.color = 'var(--muted)';
  res.textContent = t('mqtt.testing');
  try {
    const r = await api('POST', '/mqtt-test', {
      host: $('mqtt-host').value,
      port: $('mqtt-port').value || '1883',
      user: $('mqtt-user').value,
      pass: $('mqtt-pass').value,
    });
    res.style.color = r.ok ? 'var(--green)' : 'var(--red)';
    res.textContent = r.ok ? t('mqtt.ok') : t('mqtt.fail', r.error);
  } catch (e) {
    res.style.color = 'var(--red)';
    res.textContent = t('mqtt.fail', e.message);
  }
});

// ── Log settings save ─────────────────────────────────────────────────────────
$('btn-save-log').addEventListener('click', async () => {
  await api('POST', '/config', { log: { level: $('log-level').value } });
  showToast(t('toast.log'));
});

$('btn-log-clear').addEventListener('click', async () => {
  await api('POST', '/logs/clear');
  $('log-view').innerHTML = '';
});

$('btn-log-download').addEventListener('click', () => {
  const lines = Array.from($('log-view').children).map(el => el.textContent).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(lines);
  a.download = 'nibepi-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.log';
  a.click();
});

// ── Registers ─────────────────────────────────────────────────────────────────
let allRegs         = [];
let registersLoaded = false;
let currentFilter   = 'all';
let searchTerm      = '';

async function loadRegisters() {
  $('reg-tbody').innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">${t('reg.loading')}</td></tr>`;
  allRegs = await api('GET', '/registers');
  registersLoaded = true;
  renderTable();
}

function renderTable() {
  const q = searchTerm.toLowerCase();
  const rows = allRegs.filter(r => {
    if (currentFilter === 'active' && !r.active) return false;
    if (currentFilter === 'rw'     && r.mode !== 'R/W') return false;
    if (q && !String(r.register).includes(q) && !r.titel.toLowerCase().includes(q)) return false;
    return true;
  });

  const tbody = $('reg-tbody');
  tbody.innerHTML = '';
  for (const r of rows) {
    const addr   = Number(r.register);
    const live   = liveValues[addr];
    const val    = live ? live.value : r.value;
    const valStr = val !== null && val !== undefined ? `${val}${r.unit ? ' '+r.unit : ''}` : '—';
    const stale  = !live;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="reg-num">${r.register}</td>
      <td>${escHtml(r.titel)}</td>
      <td style="color:var(--muted)">${escHtml(r.unit || '—')}</td>
      <td><span class="tag ${r.mode === 'R/W' ? 'tag-rw' : 'tag-r'}">${r.mode}</span></td>
      <td><span class="live-val${stale ? ' stale' : ''}" id="val-${addr}">${escHtml(valStr)}</span></td>
      <td>${r.mode === 'R/W' ? `<button class="btn btn-ghost btn-sm reg-write-btn" data-reg="${addr}" title="${t('reg.write')}">✎</button>` : ''}</td>
      <td>
        ${r.active ? `<button class="chart-btn${chartedRegisters.has(addr) ? ' active' : ''}" data-chart="${addr}">&#9193;</button>` : ''}
      </td>
      <td>
        <label class="switch">
          <input type="checkbox" data-reg="${addr}" ${r.active ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </td>
    `;
    tbody.appendChild(tr);
  }

  $('reg-count').textContent = t('reg.count', rows.length, allRegs.length);

  tbody.querySelectorAll('button[data-chart]').forEach(btn => {
    btn.addEventListener('click', () => toggleChart(Number(btn.dataset.chart)));
  });

  tbody.querySelectorAll('.reg-write-btn').forEach(btn => {
    btn.addEventListener('click', () => openWriteEditor(Number(btn.dataset.reg), btn));
  });

  tbody.querySelectorAll('input[data-reg]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const reg = Number(cb.dataset.reg);
      if (cb.checked) {
        await api('POST', '/register/add', { register: reg });
        const r = allRegs.find(x => Number(x.register) === reg);
        if (r) r.active = true;
      } else {
        await api('POST', '/register/remove', { register: reg });
        const r = allRegs.find(x => Number(x.register) === reg);
        if (r) r.active = false;
      }
    });
  });
}

function updateTableCell(register, value, unit) {
  const el = $(`val-${register}`);
  if (el) {
    if (el.dataset.editing) return;
    el.textContent = `${value}${unit ? ' '+unit : ''}`;
    el.classList.remove('stale');
    el.style.transition = 'none';
    el.style.color = 'var(--accent)';
    setTimeout(() => { el.style.transition = 'color .6s'; el.style.color = ''; }, 100);
  }
  if (chartedRegisters.has(register)) {
    if (!recordedValues[register]) recordedValues[register] = [];
    recordedValues[register].push({ t: Date.now(), v: value });
    if (recordedValues[register].length > MAX_HISTORY)
      recordedValues[register] = compactHistory(recordedValues[register]);
    scheduleChartRender();
  }
}

$('reg-search').addEventListener('input', e => { searchTerm = e.target.value; renderTable(); });
$('btn-reg-refresh').addEventListener('click', () => loadRegisters());

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable();
  });
});

// ── Memory chart ─────────────────────────────────────────────────────────────
let _memLiveTimer = null;

async function loadMemChart() {
  const resp = await api('GET', '/memhistory').catch(() => null);
  const wrap = $('mem-chart-wrap');

  // Stop any previous live-refresh timer
  if (_memLiveTimer) { clearInterval(_memLiveTimer); _memLiveTimer = null; }

  const pts = resp && resp.history ? resp.history : (Array.isArray(resp) ? resp : []);
  const cur = resp && resp.current ? resp.current : null;

  const toMB = b => (b / (1024 * 1024)).toFixed(1);

  // Live-label updater (every 5 s, lightweight — just fetches current values)
  async function refreshLiveLabel() {
    try {
      const r = await api('GET', '/memhistory');
      const c = r && r.current ? r.current : null;
      if (!c) return;
      const bridgeEl   = document.getElementById('mem-live-bridge');
      const backendEl  = document.getElementById('mem-live-backend');
      if (bridgeEl)  bridgeEl.textContent  = `bridge ${toMB(c.bridge)} MB`;
      if (backendEl && c.backend > 0) backendEl.textContent = `backend ${toMB(c.backend)} MB`;
    } catch {}
  }

  if (!pts || pts.length === 0) {
    const c = cur || { bridge: 0, backend: 0 };
    wrap.innerHTML = `
      <div style="display:flex;gap:16px;font-size:11px;color:var(--muted);margin-bottom:6px">
        <span><span style="color:#4f8ef7">●</span> <span id="mem-live-bridge">bridge ${toMB(c.bridge)} MB</span></span>
        ${c.backend > 0 ? `<span><span style="color:#94a3b8">●</span> <span id="mem-live-backend">backend ${toMB(c.backend)} MB</span></span>` : ''}
      </div>
      <p style="color:var(--muted);font-size:13px">${t('chart.waiting')}</p>`;
    _memLiveTimer = setInterval(refreshLiveLabel, 5000);
    return;
  }

  const W = 540, H = 120, PAD_L = 36, PAD_R = 8, PAD_V = 10;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_V * 2;

  const tMin   = pts[0].t;
  const tMax   = pts[pts.length - 1].t;
  const tRange = tMax - tMin || 1;

  const allMB  = pts.flatMap(p => [p.bridge / 1048576, p.backend > 0 ? p.backend / 1048576 : null]).filter(v => v !== null);
  const maxMB  = Math.max(...allMB, 10);
  const mbRange = maxMB || 1;

  const toX = ts => PAD_L + ((ts - tMin) / tRange) * plotW;
  const toY = mb => PAD_V + plotH - (mb / mbRange) * plotH;

  const bridgePts  = pts.map(p => `${toX(p.t).toFixed(1)},${toY(p.bridge / 1048576).toFixed(1)}`).join(' ');
  const backendPts = pts.filter(p => p.backend > 0).map(p => `${toX(p.t).toFixed(1)},${toY(p.backend / 1048576).toFixed(1)}`).join(' ');

  const liveBridge  = cur ? toMB(cur.bridge)  : toMB(pts[pts.length - 1].bridge);
  const liveBackend = cur && cur.backend > 0 ? toMB(cur.backend)
    : (pts[pts.length - 1].backend > 0 ? toMB(pts[pts.length - 1].backend) : null);

  const fmtAge = ms => {
    const h = Math.round(ms / 3600000);
    return h < 24 ? `${h}h` : `${Math.round(h / 24)}d`;
  };

  const yTop = PAD_V + 2, yBot = H - PAD_V - 2, yMid = (yTop + yBot) / 2;
  const midMB = (maxMB / 2).toFixed(0);

  wrap.innerHTML = `
    <div style="display:flex;gap:16px;font-size:11px;color:var(--muted);margin-bottom:6px">
      <span><span style="color:#4f8ef7">●</span> <span id="mem-live-bridge">bridge ${liveBridge} MB</span></span>
      ${liveBackend !== null ? `<span><span style="color:#94a3b8">●</span> <span id="mem-live-backend">backend ${liveBackend} MB</span></span>` : ''}
      <span style="margin-left:auto">${pts.length} samples</span>
    </div>
    <svg id="mem-chart-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mg-bridge" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#4f8ef7" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#4f8ef7" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <line x1="${PAD_L}" y1="${yTop}" x2="${W-PAD_R}" y2="${yTop}" stroke="var(--border)" stroke-width="0.5"/>
      <line x1="${PAD_L}" y1="${yMid}" x2="${W-PAD_R}" y2="${yMid}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>
      <line x1="${PAD_L}" y1="${yBot}" x2="${W-PAD_R}" y2="${yBot}" stroke="var(--border)" stroke-width="0.5"/>
      <text x="${PAD_L-4}" y="${yTop+3}"  text-anchor="end" font-size="9" fill="var(--muted)">${maxMB.toFixed(0)}</text>
      <text x="${PAD_L-4}" y="${yMid+3}"  text-anchor="end" font-size="9" fill="var(--muted)">${midMB}</text>
      <text x="${PAD_L-4}" y="${yBot+3}"  text-anchor="end" font-size="9" fill="var(--muted)">0</text>
      <polygon points="${PAD_L},${H-PAD_V} ${bridgePts} ${toX(tMax).toFixed(1)},${H-PAD_V}" fill="url(#mg-bridge)"/>
      <polyline points="${bridgePts}"  fill="none" stroke="#4f8ef7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${backendPts ? `<polyline points="${backendPts}" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,2"/>` : ''}
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:2px ${PAD_R}px 0 ${PAD_L}px">
      <span>${fmtAge(Date.now() - tMin)} ago</span>
      <span>${pts.length > 1 ? fmtAge(tMax - tMin) + ' span' : ''}</span>
      <span>now</span>
    </div>`;

  _memLiveTimer = setInterval(refreshLiveLabel, 5000);

  // ── Memory chart interactivity ──────────────────────────────────────────────
  const memSvg = document.getElementById('mem-chart-svg');
  if (memSvg && pts.length >= 2) {
    const ns     = 'http://www.w3.org/2000/svg';
    const plotW  = W - PAD_L - PAD_R;
    const plotH  = H - PAD_V * 2;
    const toY    = mb => PAD_V + plotH - (mb / mbRange) * plotH;
    const toMBv  = b  => +(b / 1048576).toFixed(1);

    const crossLine = document.createElementNS(ns, 'line');
    crossLine.setAttribute('y1', String(PAD_V));
    crossLine.setAttribute('y2', String(H - PAD_V));
    crossLine.setAttribute('stroke', 'rgba(255,255,255,0.35)');
    crossLine.setAttribute('stroke-width', '1');
    crossLine.setAttribute('stroke-dasharray', '3,2');
    crossLine.style.display = 'none';
    memSvg.appendChild(crossLine);

    const dotBridge = document.createElementNS(ns, 'circle');
    dotBridge.setAttribute('r', '4'); dotBridge.setAttribute('fill', '#4f8ef7');
    dotBridge.setAttribute('stroke', '#1a1d2e'); dotBridge.setAttribute('stroke-width', '1.5');
    dotBridge.style.display = 'none';
    memSvg.appendChild(dotBridge);

    const hasBackend = pts.some(p => p.backend > 0);
    let dotBackend;
    if (hasBackend) {
      dotBackend = document.createElementNS(ns, 'circle');
      dotBackend.setAttribute('r', '4'); dotBackend.setAttribute('fill', '#94a3b8');
      dotBackend.setAttribute('stroke', '#1a1d2e'); dotBackend.setAttribute('stroke-width', '1.5');
      dotBackend.style.display = 'none';
      memSvg.appendChild(dotBackend);
    }

    const tooltip = document.createElement('div');
    tooltip.className = 'chart-tooltip';
    tooltip.style.display = 'none';
    wrap.appendChild(tooltip);

    const findNearest = t => {
      let lo = 0, hi = pts.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (pts[mid].t < t) lo = mid + 1; else hi = mid;
      }
      if (lo > 0 && Math.abs(pts[lo - 1].t - t) < Math.abs(pts[lo].t - t)) lo--;
      return lo;
    };

    const fmtAgeMs = ms => {
      const s = Math.round(ms / 1000);
      return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}min` : `${(s / 3600).toFixed(1)}h`;
    };

    const show = clientX => {
      const rect = memSvg.getBoundingClientRect();
      const svgX = Math.max(PAD_L, Math.min(W - PAD_R, (clientX - rect.left) / rect.width * W));
      const t    = tMin + ((svgX - PAD_L) / plotW) * tRange;
      const pt   = pts[findNearest(t)];
      const sx   = PAD_L + ((pt.t - tMin) / tRange) * plotW;

      crossLine.setAttribute('x1', String(sx)); crossLine.setAttribute('x2', String(sx));
      crossLine.style.display = '';

      const bMB = toMBv(pt.bridge);
      dotBridge.setAttribute('cx', String(sx)); dotBridge.setAttribute('cy', String(toY(bMB)));
      dotBridge.style.display = '';

      let tipHtml = `<span style="color:#4f8ef7;font-weight:600">${bMB} MB</span> bridge`;
      if (hasBackend && pt.backend > 0) {
        const eMB = toMBv(pt.backend);
        dotBackend.setAttribute('cx', String(sx)); dotBackend.setAttribute('cy', String(toY(eMB)));
        dotBackend.style.display = '';
        tipHtml += `<br><span style="color:#94a3b8;font-weight:600">${eMB} MB</span> backend`;
      } else if (dotBackend) {
        dotBackend.style.display = 'none';
      }
      tipHtml += `<br><span style="color:var(--muted);font-size:10px">${fmtAgeMs(Date.now() - pt.t)} ago</span>`;

      tooltip.innerHTML = tipHtml;
      tooltip.style.display = 'block';

      const dotPxX = memSvg.offsetLeft + (sx / W) * memSvg.offsetWidth;
      const tipW   = tooltip.offsetWidth;
      const goLeft = dotPxX - tipW - 10 > 0;
      tooltip.style.left  = goLeft ? `${dotPxX - tipW - 6}px` : `${dotPxX + 10}px`;
      tooltip.style.right = '';
      tooltip.style.top   = `${memSvg.offsetTop + 4}px`;
    };

    const hide = () => {
      crossLine.style.display = 'none';
      dotBridge.style.display = 'none';
      if (dotBackend) dotBackend.style.display = 'none';
      tooltip.style.display   = 'none';
    };

    memSvg.addEventListener('mousemove',  e => show(e.clientX));
    memSvg.addEventListener('mouseleave', hide);
    memSvg.addEventListener('touchstart', e => { e.preventDefault(); show(e.touches[0].clientX); }, { passive: false });
    memSvg.addEventListener('touchmove',  e => { e.preventDefault(); show(e.touches[0].clientX); }, { passive: false });
    memSvg.addEventListener('touchend',   hide);
  }
}

// ── Register write ────────────────────────────────────────────────────────────
function parseStateMap(info) {
  if (!info) return null;
  if (/binary encoded|bitmap|\bBit\d+=|\bb\d+:/i.test(info)) return null;
  const parts = info.split(/(?=\b\d+=)/);
  const pairs = {};
  for (const part of parts) {
    const m = part.match(/^(\d+)=(.+)/);
    if (!m) continue;
    const num   = parseInt(m[1]);
    const label = m[2].replace(/,\s*$/, '').trim();
    if (label && !(num in pairs)) pairs[num] = label;
  }
  return Object.keys(pairs).length >= 2 ? pairs : null;
}

function sizeBounds(size) {
  switch (size) {
    case 'u8':  return { min: 0,           max: 255         };
    case 's8':  return { min: -128,        max: 127         };
    case 'u16': return { min: 0,           max: 65535       };
    case 's16': return { min: -32768,      max: 32767       };
    case 'u32': return { min: 0,           max: 4294967295  };
    case 's32': return { min: -2147483648, max: 2147483647  };
    default:    return null;
  }
}

function openWriteEditor(addr, triggerBtn) {
  const r = allRegs.find(x => Number(x.register) === addr);
  if (!r) return;
  const valEl = $(`val-${addr}`);
  if (!valEl) return;

  // Prevent double-open
  if (valEl.dataset.editing) return;
  valEl.dataset.editing = '1';

  const stateMap = parseStateMap(r.info);
  const factor   = Number(r.factor) || 1;
  const rawMin   = Number(r.min);
  const rawMax   = Number(r.max);
  const hasRange = rawMin !== 0 || rawMax !== 0;
  const curVal   = liveValues[addr] ? liveValues[addr].value : r.value;

  let input;
  if (stateMap) {
    // ── State map → dropdown ──────────────────────────────────────────────────
    input = document.createElement('select');
    input.className = 'input-field';
    input.style.cssText = 'width:auto;font-size:12px;padding:2px 4px';
    for (const [k, v] of Object.entries(stateMap)) {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = v;
      if (String(curVal) === k) opt.selected = true;
      input.appendChild(opt);
    }
  } else {
    // ── Numeric input ─────────────────────────────────────────────────────────
    const isBool = rawMin === 0 && rawMax === 1;

    if (isBool) {
      // Boolean (0/1) → two-option select
      input = document.createElement('select');
      input.className = 'input-field';
      input.style.cssText = 'width:auto;font-size:12px;padding:2px 4px';
      for (const [k, label] of [['0','0'],['1','1']]) {
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = label;
        if (String(Math.round(Number(curVal))) === k) opt.selected = true;
        input.appendChild(opt);
      }
    } else {
      input = document.createElement('input');
      input.type = 'number';
      input.className = 'input-field';
      input.style.cssText = 'width:80px;font-size:12px;padding:2px 4px';
      input.step = factor > 1 ? String(1 / factor) : '1';

      if (hasRange) {
        // Scale raw model bounds to displayed (user-facing) values
        input.min = String(rawMin / factor);
        input.max = String(rawMax / factor);
      } else {
        // Fall back to type-level limits so garbage writes are caught in the UI
        const fb = sizeBounds(r.size);
        if (fb) {
          input.min = String(fb.min / factor);
          input.max = String(fb.max / factor);
        }
      }

      if (curVal !== null && curVal !== undefined) input.value = curVal;
    }
  }

  const btnOk = document.createElement('button');
  btnOk.className = 'btn btn-ghost btn-sm';
  btnOk.textContent = '✓';

  const btnX = document.createElement('button');
  btnX.className = 'btn btn-ghost btn-sm';
  btnX.textContent = '✗';

  // ── Inline range validation ───────────────────────────────────────────────
  const validate = () => {
    if (input.tagName === 'SELECT') { btnOk.disabled = false; input.style.borderColor = ''; return; }
    const v  = parseFloat(input.value);
    const lo = input.min !== '' ? parseFloat(input.min) : -Infinity;
    const hi = input.max !== '' ? parseFloat(input.max) : Infinity;
    const bad = isNaN(v) || v < lo || v > hi;
    input.style.borderColor = bad ? 'var(--red,#f75f5f)' : '';
    btnOk.disabled = bad;
  };
  input.addEventListener('input', validate);
  validate();

  // ── Unit label ────────────────────────────────────────────────────────────
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:inline-flex;gap:4px;align-items:center';
  wrap.appendChild(input);
  if (r.unit && r.unit.trim()) {
    const unitLbl = document.createElement('span');
    unitLbl.style.cssText = 'font-size:11px;color:var(--muted);white-space:nowrap';
    unitLbl.textContent = r.unit;
    wrap.appendChild(unitLbl);
  }
  wrap.appendChild(btnOk);
  wrap.appendChild(btnX);

  // ── Info hint (only for non-state-map registers with useful description) ──
  let hintEl = null;
  if (r.info && r.info.trim() && !stateMap) {
    hintEl = document.createElement('div');
    hintEl.style.cssText = 'font-size:11px;color:var(--muted);margin-top:2px;max-width:220px;line-height:1.3';
    hintEl.textContent = r.info.length > 80 ? r.info.slice(0, 80) + '…' : r.info;
  }

  const origContent = valEl.textContent;
  valEl.style.display = 'inline-block';
  valEl.textContent = '';
  valEl.appendChild(wrap);
  if (hintEl) valEl.appendChild(hintEl);
  input.focus();

  const cancel = () => {
    delete valEl.dataset.editing;
    valEl.style.display = '';
    valEl.textContent = origContent;
  };

  const confirm = async () => {
    if (btnOk.disabled) return;
    const val = input.value;
    try {
      await api('POST', '/register/set', { register: addr, value: val });
      showToast(t('toast.regSet', addr));
    } catch (e) {
      showToast(e.message);
    }
    cancel();
  };

  btnOk.addEventListener('click', confirm);
  btnX.addEventListener('click',  cancel);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  confirm();
    if (e.key === 'Escape') cancel();
  });
}

// ── Chart ─────────────────────────────────────────────────────────────────────
const MAX_HISTORY      = 360;
const chartedRegisters = new Set();

// Same two-tier time-uniform compaction as the server ring buffer.
// Keeps the last ~30 min verbatim + uniformly-in-time decimated history.
// Prevents exponential gap growth and preserves old data instead of dropping it.
function compactHistory(buf) {
  const nRecent = Math.floor(MAX_HISTORY / 2);  // 180 — verbatim recent
  const nHist   = Math.ceil(MAX_HISTORY / 4);   // 90  — time-uniform history
  const recent  = buf.slice(-nRecent);
  const old     = buf.slice(0, buf.length - nRecent);
  const hist    = [];
  if (old.length > 0) {
    const tMin  = old[0].t, tMax = old[old.length - 1].t;
    const count = Math.min(nHist, old.length);
    const tSpan = tMax - tMin;
    let j = 0;
    for (let k = 0; k < count; k++) {
      const tTarget = tSpan > 0 ? tMin + k * tSpan / (count - 1) : tMin;
      while (j < old.length - 1 &&
             Math.abs(old[j + 1].t - tTarget) < Math.abs(old[j].t - tTarget)) j++;
      hist.push(old[j]);
    }
  }
  return hist.concat(recent);
}
const recordedValues   = {};
const CHART_COLORS     = ['#4f8ef7','#3ecf8e','#f7c948','#f75f5f','#a78bfa','#f97316','#06b6d4','#84cc16'];
let   chartColorIdx    = 0;
const regColors        = {};
let   chartRafPending  = false;

function scheduleChartRender() {
  if (chartRafPending) return;
  chartRafPending = true;
  requestAnimationFrame(() => { chartRafPending = false; renderCharts(); });
}

function toggleChart(addr) {
  if (chartedRegisters.has(addr)) {
    chartedRegisters.delete(addr);
    document.querySelectorAll('button[data-chart]').forEach(btn => {
      btn.classList.toggle('active', chartedRegisters.has(Number(btn.dataset.chart)));
    });
    renderCharts();
    return;
  }
  chartedRegisters.add(addr);
  if (!regColors[addr]) {
    regColors[addr] = CHART_COLORS[chartColorIdx % CHART_COLORS.length];
    chartColorIdx++;
  }
  document.querySelectorAll('button[data-chart]').forEach(btn => {
    btn.classList.toggle('active', chartedRegisters.has(Number(btn.dataset.chart)));
  });
  // Always fetch fresh ring-buffer history from the server when opening a chart
  fetch('/api/history/' + addr)
    .then(r => r.json())
    .then(pts => {
      if (pts.length > 0) recordedValues[addr] = pts;
      else if (!recordedValues[addr]) recordedValues[addr] = [];
      renderCharts();
    })
    .catch(() => { if (!recordedValues[addr]) recordedValues[addr] = []; renderCharts(); });
}

function renderCharts() {
  const panel = $('chart-panel');
  if (chartedRegisters.size === 0) { panel.className = ''; panel.innerHTML = ''; return; }
  panel.className = 'visible';

  const regs  = [...chartedRegisters];
  const W     = 600, H = 72, PAD_L = 52, PAD_R = 8, PAD_V = 8;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_V * 2;

  let gTmin = Infinity, gTmax = -Infinity;
  for (const addr of regs) {
    for (const p of (recordedValues[addr] || [])) {
      if (p.t < gTmin) gTmin = p.t;
      if (p.t > gTmax) gTmax = p.t;
    }
  }
  if (!isFinite(gTmin)) gTmin = gTmax = Date.now();
  const gRange = gTmax - gTmin || 1;

  const fmtDur = ms => {
    const s = Math.round(ms / 1000);
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}min` : `${(s / 3600).toFixed(1)}h`;
  };
  const toX = ts => PAD_L + ((ts - gTmin) / gRange) * plotW;

  const ruler = `<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:2px ${PAD_R}px 4px ${PAD_L}px">
    <span>${t('chart.ago', fmtDur(Date.now() - gTmin))}</span>
    <span style="opacity:.5">↔ ${fmtDur(gTmax - gTmin)}</span>
    <span>${t('chart.now')}</span>
  </div>`;

  const html = regs.map(addr => {
    const pts    = recordedValues[addr] || [];
    const reg    = allRegs.find(r => Number(r.register) === addr);
    const title  = reg ? reg.titel : `#${addr}`;
    const unit   = reg ? (reg.unit || '') : '';
    const color  = regColors[addr] || '#4f8ef7';
    const closeBtn = `<button class="chart-btn" onclick="toggleChart(${addr})" title="${t('chart.close')}">×</button>`;

    if (pts.length < 2) {
      return `<div class="sparkline-wrap">
        <div class="sparkline-header">
          <span class="sparkline-title" style="color:${color}">${escHtml(title)}</span>
          <span class="sparkline-meta">${t('chart.waiting')}</span>
          ${closeBtn}
        </div>
      </div>`;
    }

    const vals  = pts.map(p => p.v);
    const minV  = Math.min(...vals);
    const maxV  = Math.max(...vals);
    const range = maxV - minV || 1;
    const cur   = vals[vals.length - 1];
    const toY   = v => PAD_V + plotH - ((v - minV) / range) * plotH;

    const points     = pts.map(p => `${toX(p.t).toFixed(1)},${toY(p.v).toFixed(1)}`).join(' ');
    const firstX     = toX(pts[0].t).toFixed(1);
    const lastX      = toX(pts[pts.length - 1].t).toFixed(1);
    const lastY      = toY(cur).toFixed(1);
    const areaPoints = `${firstX},${H - PAD_V} ${points} ${lastX},${H - PAD_V}`;

    const yTop = PAD_V + 4;
    const yBot = H - PAD_V - 2;
    const yMid = (yTop + yBot) / 2;

    return `<div class="sparkline-wrap">
      <div class="sparkline-header">
        <span class="sparkline-title" style="color:${color}">${escHtml(title)}</span>
        <span class="sparkline-meta">${cur} ${escHtml(unit)} &nbsp;&middot;&nbsp; ↓${minV} ↑${maxV} &nbsp;&middot;&nbsp; ${pts.length} pts</span>
        ${closeBtn}
      </div>
      <svg class="sparkline-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-addr="${addr}">
        <defs>
          <linearGradient id="sg${addr}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="${color}" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
          </linearGradient>
        </defs>
        <line x1="${PAD_L}" y1="${yTop}" x2="${W - PAD_R}" y2="${yTop}" stroke="var(--border)" stroke-width="0.5"/>
        <line x1="${PAD_L}" y1="${yMid}" x2="${W - PAD_R}" y2="${yMid}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="3,3"/>
        <line x1="${PAD_L}" y1="${yBot}" x2="${W - PAD_R}" y2="${yBot}" stroke="var(--border)" stroke-width="0.5"/>
        <text x="${PAD_L - 4}" y="${yTop + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${maxV}</text>
        <text x="${PAD_L - 4}" y="${yMid + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${((minV + maxV) / 2).toFixed(1)}</text>
        <text x="${PAD_L - 4}" y="${yBot + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${minV}</text>
        <polygon points="${areaPoints}" fill="url(#sg${addr})"/>
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="2.5" fill="${color}"/>
      </svg>
    </div>`;
  }).join('');

  panel.innerHTML = ruler + html;
  attachChartInteractivity();
}

function attachChartInteractivity() {
  const W = 600, H = 72, PAD_L = 52, PAD_R = 8, PAD_V = 8;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_V * 2;
  const ns = 'http://www.w3.org/2000/svg';

  // Recompute global time range (same scan as renderCharts)
  let gTmin = Infinity, gTmax = -Infinity;
  for (const addr of chartedRegisters) {
    for (const p of (recordedValues[addr] || [])) {
      if (p.t < gTmin) gTmin = p.t;
      if (p.t > gTmax) gTmax = p.t;
    }
  }
  if (!isFinite(gTmin)) return;
  const gRange = gTmax - gTmin || 1;

  $('chart-panel').querySelectorAll('svg[data-addr]').forEach(svg => {
    const addr = Number(svg.dataset.addr);
    const pts  = recordedValues[addr];
    if (!pts || pts.length < 2) return;

    const reg   = allRegs.find(r => Number(r.register) === addr);
    const unit  = reg ? (reg.unit || '') : '';
    const color = regColors[addr] || '#4f8ef7';

    // Precompute Y scale for this register
    const vmin  = Math.min(...pts.map(p => p.v));
    const vmax  = Math.max(...pts.map(p => p.v));
    const vspan = vmax - vmin || 1;
    const toY   = v => PAD_V + plotH - ((v - vmin) / vspan) * plotH;

    // Crosshair line
    const crossLine = document.createElementNS(ns, 'line');
    crossLine.setAttribute('y1', String(PAD_V));
    crossLine.setAttribute('y2', String(H - PAD_V));
    crossLine.setAttribute('stroke', 'rgba(255,255,255,0.35)');
    crossLine.setAttribute('stroke-width', '1');
    crossLine.setAttribute('stroke-dasharray', '3,2');
    crossLine.style.display = 'none';
    svg.appendChild(crossLine);

    // Snap dot
    const snapDot = document.createElementNS(ns, 'circle');
    snapDot.setAttribute('r', '3.5');
    snapDot.setAttribute('fill', color);
    snapDot.setAttribute('stroke', '#1a1d2e');
    snapDot.setAttribute('stroke-width', '1.5');
    snapDot.style.display = 'none';
    svg.appendChild(snapDot);

    // Tooltip
    const wrap    = svg.closest('.sparkline-wrap');
    const tooltip = document.createElement('div');
    tooltip.className = 'chart-tooltip';
    tooltip.style.display = 'none';
    wrap.appendChild(tooltip);

    // Binary search: nearest point to timestamp t
    const findNearest = t => {
      let lo = 0, hi = pts.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (pts[mid].t < t) lo = mid + 1; else hi = mid;
      }
      if (lo > 0 && Math.abs(pts[lo - 1].t - t) < Math.abs(pts[lo].t - t)) lo--;
      return lo;
    };

    const fmtAge = ms => {
      const s = Math.round(ms / 1000);
      return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}min` : `${(s / 3600).toFixed(1)}h`;
    };

    const show = clientX => {
      const rect  = svg.getBoundingClientRect();
      const svgX  = Math.max(PAD_L, Math.min(W - PAD_R, (clientX - rect.left) / rect.width * W));
      const t     = gTmin + ((svgX - PAD_L) / plotW) * gRange;
      const pt    = pts[findNearest(t)];

      const sx = PAD_L + ((pt.t - gTmin) / gRange) * plotW;
      const sy = toY(pt.v);

      crossLine.setAttribute('x1', String(sx)); crossLine.setAttribute('x2', String(sx));
      crossLine.style.display = '';
      snapDot.setAttribute('cx', String(sx)); snapDot.setAttribute('cy', String(sy));
      snapDot.style.display = '';

      tooltip.innerHTML = `<span style="font-weight:600">${pt.v}${unit ? ' ' + escHtml(unit) : ''}</span><br>`
                        + `<span style="color:var(--muted);font-size:10px">${fmtAge(Date.now() - pt.t)} ago</span>`;
      tooltip.style.display = 'block';

      // Position tooltip: left of dot, flip right if near left edge
      const dotPxX   = svg.offsetLeft + (sx / W) * svg.offsetWidth;
      const tipW     = tooltip.offsetWidth;
      const wrapW    = wrap.offsetWidth;
      const goLeft   = dotPxX - tipW - 10 > 0;
      tooltip.style.left  = goLeft ? `${dotPxX - tipW - 6}px` : `${dotPxX + 10}px`;
      tooltip.style.right = '';
      tooltip.style.top   = `${svg.offsetTop + 4}px`;
    };

    const hide = () => {
      crossLine.style.display = 'none';
      snapDot.style.display   = 'none';
      tooltip.style.display   = 'none';
    };

    svg.addEventListener('mousemove',  e => show(e.clientX));
    svg.addEventListener('mouseleave', hide);
    svg.addEventListener('touchstart',  e => { e.preventDefault(); show(e.touches[0].clientX); }, { passive: false });
    svg.addEventListener('touchmove',   e => { e.preventDefault(); show(e.touches[0].clientX); }, { passive: false });
    svg.addEventListener('touchend',    hide);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
Promise.all([loadLang(currentLang), loadAlarmDescs()]).then(() => { applyLang(); loadConfig(); openEvents(); openLogs(); });
</script>
</body>
</html>
